<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>同享 · 顾问切换 Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#e6e8ee;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#1f2329}
.phone{position:relative;width:375px;height:812px;overflow:hidden;background:
 radial-gradient(120% 40% at 0% 50%,rgba(214,240,255,.75) 0%,rgba(214,240,255,0) 60%),
 radial-gradient(90% 45% at 100% 8%,rgba(234,226,255,.9) 0%,rgba(234,226,255,0) 70%),
 radial-gradient(80% 35% at 30% 0%,rgba(226,236,255,.9) 0%,rgba(226,236,255,0) 70%),
 linear-gradient(180deg,#eef2ff 0%,#f2f4ff 40%,#f7f8ff 70%,#fbfcff 100%);box-shadow:0 20px 60px rgba(30,40,80,.18)}
@media (max-width:430px){body{display:block;background:#fff}.phone{width:100vw;height:100vh;box-shadow:none}}

/* status */
.status{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 30px;z-index:5}
.status .t{font-size:15px;font-weight:600;letter-spacing:-.2px;color:#111}
.status .ic{display:flex;gap:5px;align-items:center}
/* nav */
.nav{position:absolute;top:48px;left:0;right:0;height:44px;z-index:5}
.nav .menu{position:absolute;left:19px;top:12px;width:20px;height:20px}
.nav .add{position:absolute;right:17px;top:12px;width:20px;height:20px;cursor:pointer}
.nav .tabs{position:absolute;left:0;right:0;top:10px;height:24px}
.nav .tab{position:absolute;transform:translateX(-50%);font-size:14px;color:#7a7f8a;line-height:24px;white-space:nowrap}
.nav .tab.on{font-size:16px;font-weight:700;color:#141820}
.nav .tab.on:after{content:"";position:absolute;left:50%;bottom:-6px;width:16px;height:3px;border-radius:2px;background:#3d6cf6;transform:translateX(-50%)}

/* scroll area */
.scroll{position:absolute;top:92px;left:0;right:0;bottom:152px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.view{transition:opacity .25s ease}
.fade{opacity:0}
.company{margin:4px auto 0;width:192px;height:32px;border-radius:16px;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;font-size:12px;color:#6b707b;gap:9px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
.company b{font-weight:400;color:#3d6cf6;display:flex;align-items:center;gap:2px}

.hero{position:relative;height:134px}
.hero .logo{position:absolute;left:22px;top:12px;width:46px;height:38px}
.hero h1{position:absolute;left:24px;top:52px;font-size:26px;font-weight:800;color:#262a33;letter-spacing:.5px;line-height:36px}
.hero p{position:absolute;left:25px;top:91px;font-size:13px;color:#7c818c;line-height:18px}
.hero .char{position:absolute;left:240px;top:4px;width:110px;height:136px;z-index:0}

.box{position:relative;z-index:2;margin:0 16px;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.95);padding:7px;box-shadow:0 6px 18px rgba(120,130,190,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pair{display:flex;gap:9px}
.sub{flex:1;border-radius:12px;background:#fafbfd;padding:12px 10px 8px 10px;min-height:94px}
.sub.g{background:linear-gradient(180deg,#eefcf3 0%,#f9fbfc 45%)}
.sub.y{background:linear-gradient(180deg,#fff8ea 0%,#f9fbfc 45%)}
.sub.o{background:linear-gradient(180deg,#fff5ea 0%,#f9fbfc 45%)}
.sub.r{background:linear-gradient(180deg,#fff0f1 0%,#f9fbfc 45%)}
.sub.b{background:linear-gradient(180deg,#eef3ff 0%,#f9fbfc 45%)}
.sub.pk{background:linear-gradient(180deg,#fff0f6 0%,#f9fbfc 45%)}
.sub.p{background:linear-gradient(180deg,#fff0f6 0%,#f9fbfc 45%)}
.ttl{display:flex;align-items:center;gap:6px;font-size:12px;color:#222;font-weight:500;line-height:16px}
.ttl svg{flex:none}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;line-height:20px}
.row:first-of-type{margin-top:11px}
.lb{font-size:12px;color:#8a8f99}
.val{font-size:12px;color:#1c1f26;white-space:nowrap}
.val i{font-style:normal;font-size:12px;margin-right:1px}
.val b{font-size:18px;font-weight:700;font-family:"DIN Alternate","SF Pro Display",-apple-system,sans-serif;margin-right:1px;letter-spacing:-.2px}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.grid .row{margin-top:10px}
.grid .row:nth-child(-n+2){margin-top:13px}
.link{display:flex;align-items:center;justify-content:space-between;height:44px;border-radius:12px;background:#fafbfd;padding:0 10px;margin-top:8px;cursor:pointer}
.link .ttl{font-size:12px}
.link .d{font-size:11px;color:#8a8f99;display:flex;align-items:center;gap:4px}
.txt{font-size:11px;color:#8a8f99;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chips{margin:20px 16px 0;display:flex;flex-direction:column;align-items:flex-start;gap:11px}
.chip{height:40px;border-radius:20px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);display:flex;align-items:center;padding:0 12px 0 8px;gap:8px;font-size:14px;color:#262a33;cursor:pointer;box-shadow:0 4px 14px rgba(120,130,190,.07);transition:transform .12s,background .12s;max-width:343px}
.chip:active{transform:scale(.97);background:rgba(240,242,250,.95)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ar{color:#9aa0aa;font-size:12px;margin-left:2px}
.chip.in{animation:chipIn .35s ease both}
@keyframes chipIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.refresh{margin:14px 0 0 26px;display:flex;align-items:center;gap:4px;font-size:12px;color:#7c818c;cursor:pointer;width:max-content}
.refresh svg{transition:transform .4s}
.refresh.spin svg{transform:rotate(360deg)}

/* chat */
.chat{padding:18px 13px 20px 22px}
.bubble{margin-left:auto;width:max-content;max-width:260px;background:#fff;border-radius:12px;padding:9px 14px;font-size:15px;color:#222;line-height:22px;box-shadow:0 2px 8px rgba(120,130,190,.06);animation:chipIn .25s ease both}
.who{display:flex;align-items:center;gap:6px;margin-top:20px;font-size:14px;color:#8a8f99}
.who img{width:24px;height:24px;border-radius:50%}
.ans{margin-top:9px;font-size:15px;color:#222;line-height:26px;padding-right:4px;animation:chipIn .3s ease both}
.typing{display:flex;gap:4px;margin-top:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#a3a9b6;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.orders{margin-top:12px;margin-right:0;border-radius:14px;background:#fff;padding:0 14px;box-shadow:0 6px 20px rgba(120,130,190,.10);animation:chipIn .35s ease both}
.ord{display:flex;align-items:center;height:80px;gap:12px;position:relative}
.ord+.ord{border-top:1px solid #f0f1f4}
.ord img{width:52px;height:52px;border-radius:4px;object-fit:cover}
.ord .n{font-size:16px;font-weight:600;color:#1c1f26;line-height:22px}
.ord .s{font-size:11px;color:#a0a5ae;margin-top:4px}
.tag{position:absolute;right:0;bottom:19px;font-size:11px;padding:1px 6px;border-radius:3px;line-height:16px}
.tag.o{background:#fff3e3;color:#f0861c}.tag.b{background:#e8f1ff;color:#3f7cf3}.tag.g{background:#e6f8ec;color:#26a85a}

/* bottom */
.bottom{position:absolute;left:0;right:0;bottom:0;height:152px;z-index:4}
.tags{position:absolute;top:11px;left:0;right:0;height:36px;display:flex;align-items:center;gap:8px;padding:0 16px 0 18px;overflow-x:auto;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.adv{flex:none;height:34px;border-radius:17px;background:rgba(255,255,255,.7);display:flex;align-items:center;gap:4px;padding:0 10px 0 6px;font-size:13px;color:#2a2e36;cursor:pointer}
.adv img{width:22px;height:22px;border-radius:50%}
.sep{flex:none;width:1px;height:16px;background:#d8dbe3;margin:0 2px}
.qt{flex:none;height:34px;border-radius:17px;background:rgba(255,255,255,.55);display:flex;align-items:center;padding:0 12px;font-size:13px;color:#2a2e36;cursor:pointer;white-space:nowrap}
.input{position:absolute;top:62px;left:18px;right:18px;height:52px;border-radius:26px;background:#fff;box-shadow:0 6px 20px rgba(120,130,190,.10);display:flex;align-items:center;padding:0 12px 0 14px}
.input input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:#222;font-family:inherit;min-width:0}
.input input::placeholder{color:#a8adb7}
.input .ics{display:flex;gap:14px;align-items:center}
.input .ics svg{cursor:pointer}
.send{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#c178ff 0%,#7a62ee 55%,#5c6cf0 100%);display:none;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(214,170,255,.35);cursor:pointer;margin-right:2px}
.input.has .send{display:flex}.input.has .ics{display:none}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:#111;transform:translateX(-50%)}

/* sheet */
.mask{position:absolute;inset:0;background:rgba(40,42,48,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;height:520px;background:#fff;border-radius:16px 16px 0 0;z-index:11;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .hd{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 14px;font-size:14px;font-weight:600;color:#1f2329}
.sheet .hd svg{cursor:pointer}
.it{margin:0 12px;height:56px;border-radius:10px;display:flex;align-items:center;padding:0 12px 0 10px;gap:9px;cursor:pointer;transition:background .12s}
.it img{width:34px;height:34px;border-radius:50%}
.it .nm{font-size:14px;font-weight:600;color:#1f2329;line-height:20px}
.it .ds{font-size:11px;color:#a3a8b1;line-height:16px;margin-top:1px}
.it .ck{margin-left:auto;display:none}
.it.sel{background:#f3f3f5}.it.sel .ck{display:block}
.it.press{background:#ededf0}
.grp{font-size:11px;color:#8a8f99;padding:14px 16px 8px}
.sheet .gap{height:1.5px}
</style>
<style id="demo-access-style">
body.demo-locked{overflow:auto}
body.demo-locked #phone{display:none!important}
.demo-access{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:#F4F7FC;overflow:auto}
.demo-access[hidden]{display:none!important}
.demo-access-panel{width:min(100%,520px);padding:36px;background:#fff;border:1px solid #E5E6EB;border-radius:18px;box-shadow:0 12px 48px rgba(15,23,42,.07)}
.demo-access-brand{display:inline-block;background:#E2231A;color:#fff;font-size:20px;font-weight:700;padding:2px 9px;margin-bottom:20px}
.demo-access-department{display:grid;grid-template-columns:56px 1fr;column-gap:12px;row-gap:6px;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid #E5E6EB;font-size:14px;line-height:1.8}
.demo-access-department-caption{color:#4E5969;font-weight:600}
.demo-access-department-name{font-weight:600;color:#1D2129}
.demo-access h1{font-size:22px;line-height:1.45;margin:0 0 10px;color:#1D2129}
.demo-access p{font-size:15px;color:#4E5969;margin:0 0 26px}
.demo-access label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.demo-access input{width:100%;height:48px;padding:0 14px;border:1px solid #C9CDD4;border-radius:8px;background:#fff;font-size:16px}
.demo-access input:focus-visible,.demo-access button:focus-visible{outline:3px solid #D6E2FF;outline-offset:2px;border-color:#2B6BFF}
.demo-access button{width:100%;height:46px;border:0;border-radius:8px;background:#2B6BFF;color:#fff;font-family:inherit;font-size:15px;font-weight:600;margin-top:6px;cursor:pointer}
.demo-access button:hover{background:#1F5AEB}
.demo-access .demo-access-error{color:#C72B26;font-size:14px;min-height:22px;margin:8px 0}
@media(max-width:480px){.demo-access{padding:20px}.demo-access-panel{padding:28px 24px}}
</style>
</head>

<section id="demo-access" class="demo-access" aria-labelledby="demo-access-title">
 <div class="demo-access-panel">

  </div>
  <h1 id="demo-access-title">联想同享 · 顾问切换 Demo</h1>
  <p>请输入密码访问</p>

   <label for="demo-access-password">访问密码</label>
   <input id="demo-access-password" type="password" required autocomplete="off" autofocus aria-describedby="demo-access-error">
   <p id="demo-access-error" class="demo-access-error" role="status" aria-live="polite"></p>
   <button type="submit">进入演示</button>
  </form>
 </div>
</section>

      <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#111"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#111"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#111"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#111"/></svg>

function send(){
  const q=$('ipt').value.trim(); if(!q) return;

  if(!chatting){ chatting=true; view.innerHTML='<div class="chat" id="chat"></div>'; }
  const chat=$('chat'), a=A[cur];
  chat.insertAdjacentHTML('beforeend',`<div class="bubble" style="${chat.children.length?'margin-top:22px':''}">${q}</div><div class="who"><img src="${IMG['a_'+cur]}">${a.name}</div><div class="typing"><i></i><i></i><i></i></div>`);
  scroll.scrollTop=scroll.scrollHeight;
  setTimeout(()=>{
    chat.querySelector('.typing').remove();

      chat.insertAdjacentHTML('beforeend',`<div class="ans">最近 7 天总共 5 笔订单。其中3 笔待发货，预计明天出库。</div>

function renderList(){

      el.classList.add('press');

}
function openSheet(){ renderList(); $('mask').classList.add('show'); $('sheet').classList.add('show'); }
function closeSheet(){ $('mask').classList.remove('show'); $('sheet').classList.remove('show'); }
function switchTo(k){
  cur=k; batch=0; chatting=false;

renderHome(false); renderTags();

<script id="demo-access-script">
(() => {
 const gate=document.getElementById('demo-access');
 const input=document.getElementById('demo-access-password');
 const error=document.getElementById('demo-access-error');
 document.getElementById('demo-access-form').addEventListener('submit',async event => {
  event.preventDefault();
  const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input.value));
  const digest=Array.from(new Uint8Array(bytes),byte=>byte.toString(16).padStart(2,'0')).join('');
  if(digest==='93d974d472940f364f66f9ed9a1b86d460d6019edc880dad6c2231656bf8a42d'){
   input.value='';
   document.body.classList.remove('demo-locked');
   gate.hidden=true;
   document.getElementById('phone').setAttribute('tabindex','-1');
   document.getElementById('phone').focus();
  }else{
   error.textContent='密码不正确，请重新输入。';
   input.setAttribute('aria-invalid','true');
   input.select();
  }
 });
 input.addEventListener('input',()=>{error.textContent='';input.removeAttribute('aria-invalid');});
})();
</script>
