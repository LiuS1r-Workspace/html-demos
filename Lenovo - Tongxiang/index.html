<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>联想同享 · 交互 Demo</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --t1:#1D2129;--t2:#4E5969;--t3:#86909C;--t4:#C9CDD4;
  --blue:#2B6BFF;--blue-h:#1F5AEB;--blue-l:#EEF3FF;--blue-b:#D6E2FF;
  --line:#EDEFF3;
  --k:#000;--kh:#2E2E2E;--k1:#0F172A;--k2:#626C7B;--k3:#9CA3AF;--k4:#C9CDD4;
  --f2:#F6F8FA;--f3:#F2F3F5;--f4:#E5E6EB;--f5:#C9CDD4;--f6:#9CA3AF;--b1:#F2F3F5;--b2:#E5E6EB;
  --ok:#1AB280;--ok-l:#E7F9F1;--err:#F54741;--err-l:#FEEDEC;--warn:#F97E13;--warn-l:#FEF4E7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--font);color:var(--t1);background:#F4F7FC;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
img{display:block;user-select:none}
a{cursor:pointer;color:inherit;text-decoration:none}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fx{flex:1}
.ic{width:18px;height:18px;stroke-width:1.7;flex:none}
.hide{display:none!important}
.muted{color:var(--t3)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(15,23,42,.14);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 外框 ============ */
.app{position:relative;display:flex;height:100vh;min-width:1180px;min-height:620px;overflow:hidden;
  background:radial-gradient(1100px 520px at 16% -10%,#DDEEFF 0%,rgba(221,238,255,0) 70%),radial-gradient(900px 560px at 96% -6%,#F0EBFF 0%,rgba(240,235,255,0) 70%),linear-gradient(180deg,#E9F4FF 0%,#F4F8FE 42%,#FAFCFF 72%,#FCFDFF 100%)}
.sb{width:256px;margin:12px 0 12px 12px;flex:none;display:flex;flex-direction:column;border-radius:20px;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.95);box-shadow:0 6px 30px rgba(41,72,152,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:width .25s,margin .25s,opacity .2s;overflow:hidden;z-index:5}
.app.sb-off .sb{width:0;margin-left:0;opacity:0;border-width:0;pointer-events:none}
.sb-open{position:absolute;left:14px;top:14px;z-index:6;display:none;align-items:center;gap:6px;height:38px;padding:0 10px 0 8px;background:rgba(255,255,255,.9);border-radius:12px;box-shadow:0 4px 16px rgba(41,72,152,.1);color:var(--t2)}
.sb-open img{width:24px;height:22px;object-fit:contain}
.sb-open .ic{width:18px;height:18px}
.app.sb-off .sb-open{display:flex}
.app.sb-off .tm-top,.app.sb-off .kp-head{padding-left:150px}
.main{flex:1;min-width:0;position:relative;display:flex}

/* ============ 侧边栏 ============ */
.sb-head{display:flex;align-items:center;gap:8px;padding:8px 14px 0 18px;height:48px;flex:none}
.sb-logo{width:22px;height:20px;object-fit:contain}
.sb-name{font-size:16px;font-weight:600;letter-spacing:.5px;flex:1}
.ib{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);flex:none;transition:background .15s,color .15s}
.ib:hover{background:rgba(15,23,42,.06);color:var(--t1)}
.ib.sm{width:24px;height:24px;border-radius:6px}
.ib.sm .ic{width:16px;height:16px}
.sb-col .ic{width:20px;height:20px;stroke-width:1.5}
.seg{margin:8px 12px 8px;display:flex;padding:3px;background:#EBF0F3;border-radius:12px;flex:none}
.seg-i{flex:1;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--t3);transition:.2s;white-space:nowrap}
.seg-i .ic{width:16px;height:16px}
.seg-i:hover{color:var(--t2)}
.seg-i.on{background:#fff;color:var(--t1);box-shadow:0 2px 8px rgba(15,23,42,.07)}
.sb-body{flex:1;overflow-y:auto;padding:4px 12px 8px;scrollbar-width:none}
.sb-body::-webkit-scrollbar{display:none}
.nav-i{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:12px;cursor:pointer;font-size:15px;color:var(--t1);margin-bottom:2px;transition:background .15s;user-select:none}
.nav-i:hover{background:rgba(15,23,42,.04)}
.nav-i.on{background:#fff;box-shadow:0 2px 10px rgba(41,72,152,.07)}
.nav-av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.nav-more,.nav-ic{width:28px;display:flex;justify-content:center;color:var(--t1);flex:none}
.nav-ic .ic{width:20px;height:20px;stroke-width:1.6}
.badge-new{margin-left:auto;font-style:normal;font-size:11px;line-height:18px;padding:0 7px;border-radius:9px;background:#F5483B;color:#fff;font-weight:600;letter-spacing:.3px}
.sb-label{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 6px 0 12px;margin-top:8px;font-size:13px;color:var(--t3)}
.sb-label .ic{width:17px;height:17px}
.sb-div{height:1px;background:rgba(15,23,42,.06);margin:8px}
.hist-search{flex:1;display:flex;align-items:center;gap:6px;height:30px;padding:0 3px 0 8px;background:#fff;border:1px solid var(--blue-b);border-radius:8px;color:var(--t3)}
.hist-search .ic{width:14px;height:14px}
.hist-search input{flex:1;border:0;outline:0;background:none;font-size:13px;min-width:0;color:var(--t1)}
.hist-i{padding:9px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px;transition:background .15s}
.hist-i:hover{background:rgba(15,23,42,.04)}
.hist-i.on{background:rgba(15,23,42,.055)}
.hist-t{font-size:14px;color:var(--t2)}
.hist-i.on .hist-t{color:var(--t1)}
.hist-t mark{background:#FFF1B8;color:inherit;border-radius:2px}
.hist-m{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--t3)}
.hist-tag{font-size:11px;line-height:18px;padding:0 6px;border:1px solid #E1E4EA;border-radius:4px;color:var(--t2);background:#fff;white-space:nowrap}
.hist-meta{margin-left:auto;white-space:nowrap}
.hist-empty{padding:16px 12px;font-size:13px;color:var(--t3)}
.sb-foot{display:flex;align-items:center;gap:4px;height:66px;padding:0 10px 0 12px;border-top:1px solid rgba(15,23,42,.06);margin:0 6px;flex:none}
.me{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0;border-radius:10px;padding:4px}
.me:hover{background:rgba(15,23,42,.04)}
.me-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FCE6E9,#F5CDD4);flex:none}
.me-av.lg{width:40px;height:40px}
.me-n{font-size:15px}
.sb-foot .ib{width:34px;height:34px}
.sb-foot .ib .ic{width:21px;height:21px;stroke-width:1.5}
.nav2{display:flex;flex-direction:column;gap:2px;padding-top:0}
.nav2-i{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:15px;color:var(--k1);cursor:pointer;user-select:none;transition:background .15s}
.nav2-i .nav-ic{width:26px}
.nav2-i .ic{width:22px;height:22px;stroke-width:1.45}
.nav2-i:hover{background:rgba(15,23,42,.04)}
.nav2-i.on{background:rgba(15,23,42,.06);font-weight:500}
.nav2-i.on .ic{stroke-width:2}

/* ============ 页面通用 ============ */
.page{flex:1;min-width:0;display:flex;height:100%;position:relative}
.col-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
.home-sc{flex:1;overflow-y:auto;overflow-x:hidden}

/* ============ 首页 ============ */
.home{width:min(800px,calc(100% - 64px));margin:0 auto;padding:clamp(28px,12.2vh,104px) 0 20px;position:relative}
.home-logo{width:58px;height:54px;object-fit:contain;margin-left:-2px}
.greet{margin:12px 0 0;font-size:34px;line-height:1.32;font-weight:700;color:#202040;letter-spacing:.5px}
.greet .hi{background:linear-gradient(90deg,#3B2C97,#6648D2);-webkit-background-clip:text;background-clip:text;color:transparent}
.greet-sub{margin:8px 0 0;font-size:16px;color:var(--t2)}
.cards-wrap{position:relative;margin-top:22px}
.hero{position:absolute;right:56px;bottom:calc(100% - 16px);height:186px;width:auto;z-index:0;pointer-events:none}
.cards{position:relative;z-index:1;display:grid;gap:12px;padding:12px;border-radius:20px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 32px rgba(52,82,160,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cards.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.n1{grid-template-columns:1fr}
.card{background:#fff;border-radius:16px;padding:14px 16px;min-height:160px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none}
.card.t-focus::before{background:radial-gradient(110% 70% at 0% 0%,rgba(34,197,94,.10),transparent 62%)}
.card.t-points::before,.card.t-opps::before,.card.t-mall::before{background:radial-gradient(110% 70% at 0% 0%,rgba(255,149,0,.10),transparent 62%)}
.card.t-leads::before,.card.t-newp::before{background:radial-gradient(110% 70% at 100% 0%,rgba(245,72,59,.07),transparent 62%)}
.card.t-rebate::before,.card.t-course::before{background:radial-gradient(110% 70% at 0% 0%,rgba(43,107,255,.08),transparent 62%)}
.card.t-visit::before,.card.t-exam::before{background:radial-gradient(110% 70% at 0% 0%,rgba(123,92,245,.08),transparent 62%)}
.card.t-sales::before{background:radial-gradient(110% 70% at 0% 0%,rgba(18,181,162,.09),transparent 62%)}
.card-h{position:relative;display:flex;align-items:center;gap:8px;height:24px;cursor:pointer}
.card-t{font-size:15px;font-weight:500;flex:1}
.card-arr{width:16px;height:16px;color:var(--t3);transition:transform .2s,color .2s}
.card-h:hover .card-arr{transform:translateX(2px);color:var(--t1)}
.ci{width:20px;height:20px;flex:none;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card-b{position:relative;flex:1;display:flex;flex-direction:column;margin-top:13px}
.c-news{display:flex;flex-direction:column;gap:13px}
.c-news-i{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--t2);cursor:pointer;min-width:0}
.c-news-i:hover{color:var(--t1)}
.ntag{flex:none;font-size:12px;line-height:20px;padding:0 6px;border-radius:4px}
.ntag.blue{background:#E8F1FE;color:#2B6BFF}.ntag.orange{background:#FFF1E5;color:#F57C1F}.ntag.purple{background:#F1ECFE;color:#7B5CF5}
.c-rows{display:flex;flex-direction:column;gap:7px}
.c-row{display:flex;align-items:center;justify-content:space-between;height:28px}
.c-lab{font-size:15px;color:var(--t2)}
.c-val{white-space:nowrap}
.c-val b{font-size:22px;font-weight:600;color:var(--t1);font-variant-numeric:tabular-nums}
.c-val i{font-style:normal;font-size:13px;color:var(--t3);margin-left:3px}
.c-link{margin-top:auto;display:inline-flex;align-items:center;gap:2px;font-size:15px;color:var(--blue);align-self:flex-start;padding-top:8px}
.c-link .ic{width:15px;height:15px}
.c-link:hover{color:var(--blue-h)}
.c-desc{font-size:15px;color:var(--t2);line-height:1.6}
.c-desc.warn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:middle}
.c-top{font-size:14px;color:var(--t2);margin-bottom:6px}
.c-prog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--t3)}
.c-prog-bar{flex:1;height:6px;border-radius:3px;background:#EEF0F4;overflow:hidden}
.c-prog-bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.c-lines{display:flex;flex-direction:column;gap:14px;font-size:15px;color:var(--t2)}
.card.wide .card-b{margin-top:16px}
.cards.one .c-rows{flex-direction:row;gap:0}
.cards.one .c-row{flex:1;flex-direction:column;align-items:flex-start;height:auto;gap:6px;padding:0 20px;border-left:1px solid var(--line)}
.cards.one .c-row:first-child{border-left:0;padding-left:0}
.home-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:12px}
.prompts{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.prompt{display:flex;align-items:center;gap:10px;min-width:360px;max-width:520px;height:46px;padding:0 14px 0 11px;border-radius:14px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);box-shadow:0 2px 12px rgba(52,82,160,.05);cursor:pointer;transition:.2s}
.prompt:hover{background:#fff;box-shadow:0 6px 18px rgba(52,82,160,.1)}
.pi{width:26px;height:26px;border-radius:50%;flex:none;padding:2px}
.prompt-t{flex:1;font-size:16px;color:var(--t1)}
.prompt-arr{width:16px;height:16px;color:var(--t3);transition:.2s}
.prompt:hover .prompt-arr{color:var(--blue);transform:translateX(2px)}
.swap{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:4px 10px;font-size:13px;color:var(--t3);border-radius:8px}
.swap .ic{width:15px;height:15px}
.swap:hover{color:var(--t1);background:rgba(255,255,255,.65)}
.custom-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.88);color:var(--blue);font-size:14px;box-shadow:0 2px 10px rgba(52,82,160,.06);flex:none;transition:.2s}
.custom-btn .ic{width:16px;height:16px}
.custom-btn:hover{background:#fff;box-shadow:0 6px 16px rgba(52,82,160,.12)}

/* ============ 输入框 ============ */
.dock{flex:none;padding:0 32px 12px;display:flex;flex-direction:column;align-items:center}
.cmp-wrap{position:relative;width:min(800px,100%)}
.composer{position:relative;background:linear-gradient(180deg,#fff,#FCFBFF);border-radius:24px;border:1px solid #ECE9F8;box-shadow:0 10px 36px rgba(72,82,190,.08);padding:11px 11px 11px 18px;cursor:text;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#D8D2F7;box-shadow:0 10px 36px rgba(72,82,190,.13)}
.cmp-top{display:flex;align-items:flex-start;gap:8px;min-height:34px;position:relative}
#ta{flex:1;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:26px;padding:4px 0;max-height:168px;min-height:34px;color:var(--t1);overflow-y:auto}
#ta::placeholder{color:#A4AAB6}
.skill-tag{flex:none;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 5px 0 9px;border:1px solid #BCD0FF;background:#F2F6FF;color:var(--blue);border-radius:8px;font-size:12px;margin-top:3px;white-space:nowrap}
.skill-tag>.ic{width:13px;height:13px;fill:var(--blue);stroke:none}
.skill-x{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);opacity:.55}
.skill-x:hover{opacity:1;background:#DCE6FF}
.skill-x .ic{width:12px;height:12px;stroke-width:2.2}
.cmp-bot{display:flex;align-items:center;gap:8px;margin-top:22px;margin-left:-7px}
.chips-sc{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.chips-sc::-webkit-scrollbar{display:none}
.chips{display:flex;gap:9px;width:max-content;padding-right:48px}
.chip{display:inline-flex;align-items:center;gap:5px;height:31px;padding:0 12px;border:1px solid #E3E5EA;border-radius:16px;background:#fff;font-size:12px;color:var(--t1);white-space:nowrap;transition:.15s}
.chip .ic{width:14px;height:14px;stroke-width:1.6}
.chip:hover{border-color:#C5D4FF;color:var(--blue)}
.chip.on{border-color:#A9C1FF;background:#EEF3FF;color:var(--blue)}
.mic{width:34px;height:34px;color:var(--t1)}
.mic .ic{width:20px;height:20px}
.send{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#8B7BFF,#E772C0);box-shadow:0 4px 12px rgba(124,108,255,.32);transition:.2s}
.send:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-1px)}
.send:disabled{background:linear-gradient(135deg,#CDC8FA,#F4C9E3);box-shadow:none}
.send .ic{width:18px;height:18px;stroke-width:2.2}
.send.stop{background:#1D2129;box-shadow:none}
.send.stop .ic{width:13px;height:13px;fill:#fff;stroke:none}
.copy{margin-top:10px;font-size:13px;color:#A9AFBA;letter-spacing:.3px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.copy i{width:1px;height:10px;background:#C9CDD4}
.listen{display:none;position:absolute;inset:0;align-items:center;gap:10px;background:#fff;font-size:15px;color:var(--blue);border-radius:8px}
.composer.listening .listen{display:flex}
.composer.listening .mic{color:var(--blue)}
.wave{display:inline-flex;gap:3px;align-items:center;height:20px}
.wave i{width:3px;height:8px;background:var(--blue);border-radius:2px;animation:wave 1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
.listen-x{margin-left:auto;font-size:13px;color:var(--t2);padding:4px 12px;border-radius:8px;background:#F4F5F7}
.listen-x:hover{background:#ECEEF1}

/* 常用指令浮层 */
.cmd-pop{position:absolute;left:0;right:0;bottom:calc(100% + 10px);z-index:20;background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(40,60,120,.14);border:1px solid #EEF0F5;padding:20px 20px 16px;animation:popIn .18s ease}
.cmd-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cmd-h b{font-size:18px;font-weight:600}
.cmd-hint{font-size:13px;color:var(--t3);flex:1}
.cmd-mg{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--blue);padding:4px 6px;border-radius:6px}
.cmd-mg:hover{background:var(--blue-l)}
.cmd-mg .ic{width:16px;height:16px}
.cmd-list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto}
.cmd-i{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:12px;cursor:pointer;user-select:none;transition:background .15s;flex:none;background:#fff}
.cmd-i:hover{background:#F5F6F8}
.cmd-t{flex:1;font-size:16px;color:var(--t1)}
.cmd-tag{font-size:13px;line-height:24px;padding:0 8px;border-radius:6px;flex:none}
.cmd-tag.blue{background:#EAF1FF;color:var(--blue)}.cmd-tag.purple{background:#F1ECFE;color:#7B5CF5}
.cmd-chev{width:16px;height:16px;color:var(--t3)}
.cmd-i.mg{cursor:grab;padding-left:10px}
.cmd-drag{color:#B6BCC7;display:flex}
.cmd-drag .ic{width:16px;height:16px}
.cmd-i .del:hover{color:#F5483B;background:#FEEDEC}
.cmd-f{display:flex;align-items:center;gap:16px;margin-top:12px;padding-top:16px;border-top:1px solid var(--line)}
.cmd-add{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 20px;border:1px solid var(--blue);color:var(--blue);border-radius:8px;font-size:16px;background:#fff;transition:.15s}
.cmd-add .ic{width:16px;height:16px;stroke-width:2}
.cmd-add:hover:not(:disabled){background:var(--blue-l)}
.cmd-add:disabled{opacity:.4}
.cmd-limit{font-size:13px;color:var(--t3)}
.cmd-form{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--blue-b);border-radius:12px;background:#F8FAFF}
.cmd-form input{flex:1;height:36px;border:1px solid #DDE3EE;border-radius:8px;padding:0 12px;outline:none;background:#fff;font-size:14px;min-width:0}
.cmd-form input:focus{border-color:var(--blue)}
.cmd-form select{height:36px;border:1px solid #DDE3EE;border-radius:8px;padding:0 8px;background:#fff;font-size:13px;outline:none}
.cmd-empty{padding:20px;text-align:center;color:var(--t3);font-size:14px}

/* ============ 按钮 ============ */
.qbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 20px;border-radius:10px;font-size:15px;transition:.15s;white-space:nowrap}
.qbtn .ic{width:16px;height:16px}
.qbtn.sm{height:32px;padding:0 14px;font-size:13px;border-radius:8px}
.qbtn.blue{background:var(--blue);color:#fff}
.qbtn.blue:hover:not(:disabled){background:var(--blue-h)}
.qbtn.blue:disabled{background:#AFC5FF}
.qbtn.gray{background:#F2F3F5;color:var(--t1)}
.qbtn.gray:hover{background:#E8EAED}
.qbtn.line{border:1px solid #DDE1E8;background:#fff;color:var(--t1)}
.qbtn.line:hover{border-color:var(--blue);color:var(--blue)}
.link-btn{color:var(--blue);font-size:15px}
.link-btn.sm{font-size:13px;margin-top:10px}
.link-btn:hover{text-decoration:underline}
.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:14px;white-space:nowrap;transition:.15s}
.kbtn .ic{width:16px;height:16px}
.kbtn .ml{width:14px;height:14px;margin-left:2px}
.kbtn.sm{height:28px;padding:0 10px;border-radius:6px;font-size:13px}
.kbtn.black{background:var(--k);color:#fff}
.kbtn.black:hover:not(:disabled){background:var(--kh)}
.kbtn.black:disabled{background:var(--f6)}
.kbtn.line{background:#fff;border:1px solid var(--b2);color:var(--k1)}
.kbtn.line:hover:not(:disabled){background:var(--f2)}
.kbtn.line:disabled{color:var(--k4)}
.kbtn.danger{background:var(--err);color:#fff}
.kbtn.danger:hover{background:#FB6F68}
.kbtn.red-t{color:var(--err)}
.sq{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--b2);display:inline-flex;align-items:center;justify-content:center;color:var(--k1);flex:none;transition:.15s}
.sq:hover{background:var(--f2)}
.sq .ic{width:18px;height:18px;stroke-width:1.5}
.sq.spinning .ic{animation:spin .6s linear}
.link-k{color:var(--k3);font-size:13px;cursor:pointer}
.link-k:hover{color:var(--k1)}

/* ============ 对话 ============ */
.chat-sc{flex:1;overflow-y:auto;overflow-x:hidden}
.chat-in{width:min(800px,calc(100% - 64px));margin:0 auto;padding:44px 0 28px}
.page.has-panel .chat-in{width:calc(100% - 64px);max-width:800px}
.msg{margin-bottom:28px}
.msg.u{display:flex;justify-content:flex-end}
.bubble{max-width:74%;background:#fff;border-radius:16px;padding:11px 20px;font-size:16px;line-height:1.65;color:var(--t1);box-shadow:0 2px 14px rgba(40,60,120,.05);white-space:pre-wrap;word-break:break-word;animation:fadeUp .25s ease}
.b-skill{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--blue);background:#EEF3FF;border-radius:6px;padding:1px 8px 1px 6px;margin-right:8px;vertical-align:1px}
.b-skill .ic{width:13px;height:13px;fill:var(--blue);stroke:none}
.msg.sys,.msg.cron{text-align:center}
.msg.sys span{display:inline-block;font-size:13px;color:var(--t3);background:rgba(255,255,255,.75);padding:5px 14px;border-radius:14px;animation:fadeUp .25s ease}
.msg.sys a{color:var(--blue);margin-left:6px}
.msg.cron span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);background:rgba(255,255,255,.8);padding:6px 14px;border-radius:14px;border:1px solid #EEF0F4}
.msg.cron .ic{width:15px;height:15px;color:var(--warn)}
.msg.agent{display:flex;gap:10px;animation:fadeUp .25s ease}
.ag-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5B93FF,#2B6BFF);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ag-av .ic{width:18px;height:18px}
.ag-n{font-size:12px;color:var(--t3);margin-bottom:4px}
.ag-b{background:#fff;border-radius:4px 16px 16px 16px;padding:10px 16px;font-size:15px;line-height:1.6;box-shadow:0 2px 12px rgba(40,60,120,.05);max-width:560px;min-height:40px;display:flex;align-items:center}
.think{margin-bottom:14px}
.think-h{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:var(--t3);user-select:none;height:28px}
.think.done .think-h{cursor:pointer}
.think.done .think-h:hover{color:var(--t2)}
.think-ic{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#3A2C7E 0 3px,transparent 3.6px),linear-gradient(135deg,#CDBBFF,#9A84F4);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);flex:none}
.think:not(.done) .think-ic{animation:pulse 1.2s infinite}
.think-chev{width:16px;height:16px}
.think-b{margin-top:8px}
.think.col .think-b{display:none}
.think-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.think-steps li{position:relative;padding-left:18px;font-size:15px;color:var(--t3);line-height:1.6;animation:fadeUp .25s ease}
.think-steps li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:#C2C7D0}
.think-steps li.cur{color:var(--t2)}
.think-steps li.cur::before{background:var(--blue);animation:pulse .9s infinite}
.think-t{margin-top:8px;padding-left:14px;border-left:2px solid #E6E8EE;font-size:14px;line-height:1.8;color:#A0A6B1}
.md{font-size:16px;line-height:1.85;color:var(--t1);word-break:break-word}
.md p{margin:0 0 10px}
.md>p:last-child{margin-bottom:0}
.md h3{font-size:19px;margin:4px 0 10px;font-weight:600}
.md h4{font-size:16px;margin:18px 0 8px;font-weight:600}
.md ul,.md ol{margin:6px 0 12px;padding-left:22px}
.md li{margin:4px 0}
.md li::marker{color:var(--t3)}
.md b{font-weight:600}
.md hr{border:0;height:1px;background:var(--line);margin:16px 0}
.md .callout{background:#FFF7EC;border-radius:10px;padding:10px 14px;font-size:14px;color:#8A5A12}
.tbl-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0 14px;background:#fff}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.6}
.tbl-wrap th{background:#F7F8FA;font-weight:500;color:var(--t2);text-align:left;padding:10px 14px;white-space:nowrap}
.tbl-wrap td{padding:10px 14px;border-top:1px solid var(--line);color:var(--t1);vertical-align:top}
.pos{color:var(--ok);font-weight:500}.neg{color:var(--t3)}
.mtag{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:4px;white-space:nowrap;font-weight:400}
.mtag.ok{background:var(--ok-l);color:var(--ok)}.mtag.wait{background:#EEF3FF;color:var(--blue)}.mtag.err{background:var(--err-l);color:var(--err)}
.code{background:#F7F8FA;border-radius:12px;margin:10px 0 14px;overflow:hidden;border:1px solid #EEF0F4}
.code-h{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:13px;color:var(--t3)}
.code-h button{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--t3)}
.code-h button:hover{color:var(--t1)}
.code-h .ic{width:14px;height:14px}
.code pre{margin:0;padding:4px 16px 16px;overflow-x:auto}
.code code{font:13.5px/1.75 "SF Mono",Menlo,Consolas,"Liberation Mono",monospace;color:#2C3340;white-space:pre}
.draft{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:8px 0 12px;font-size:15px}
.fade-up{animation:fadeUp .35s ease both}
.files{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 4px}
.fcard{display:flex;align-items:center;gap:12px;width:280px;height:70px;padding:0 10px 0 16px;background:#fff;border:1px solid #E9EBF0;border-radius:14px;cursor:pointer;transition:.2s}
.fcard:hover{border-color:#C9D7FF;box-shadow:0 6px 18px rgba(40,60,120,.08)}
.fi{flex:none}
.fc-t{flex:1;min-width:0}
.fc-n{font-size:14px;font-weight:500;color:var(--t1)}
.fc-m{font-size:12px;color:var(--t3);margin-top:3px}
.fc-dl{color:var(--t2)}
.src-chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;margin-top:16px;background:#fff;border:1px solid #EDEFF3;border-radius:18px;font-size:15px;color:var(--t1);transition:.15s}
.src-chip:hover{border-color:#C9D7FF;box-shadow:0 4px 12px rgba(40,60,120,.06)}
.src-ics{display:inline-flex}
.src-ics i{width:14px;height:14px;border-radius:4px;background:#F5483B;border:1.5px solid #fff}
.src-ics i+i{margin-left:-5px;background:#FF8E86}
.acts{display:flex;align-items:center;gap:8px 22px;margin-top:14px;flex-wrap:wrap}
.a-stopped{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:13px;color:var(--t3)}
.a-stopped .ic{width:14px;height:14px}
.acts button{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--t2);transition:color .15s;white-space:nowrap}
.acts button:hover{color:var(--t1)}
.acts .ic{width:16px;height:16px}
.acts button.on{color:var(--blue)}
.acts button.on .ic{stroke-width:2}
.follow{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:22px}
.fl{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 16px;border-radius:12px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);font-size:15px;color:var(--t1);box-shadow:0 2px 10px rgba(40,60,120,.04);transition:.15s}
.fl .ic{width:15px;height:15px;color:var(--t3)}
.fl:hover{background:#fff;color:var(--blue)}
.fl:hover .ic{color:var(--blue)}

/* 回答卡片 */
.dcard{background:#fff;border-radius:16px;border:1px solid #EEF0F4;padding:16px 18px;margin:10px 0 12px;box-shadow:0 4px 18px rgba(40,60,120,.04)}
.dc-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.dc-h b{font-size:16px;font-weight:600}
.dc-h span{font-size:13px;color:var(--t3)}
.dc-more{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:38px;margin-top:4px;font-size:14px;color:var(--t2);border-top:1px solid var(--line)}
.dc-more .ic{width:15px;height:15px}
.dc-more:hover{color:var(--blue)}
.leads{display:flex;flex-direction:column}
.lead{display:flex;align-items:center;gap:16px;padding:10px 0;border-top:1px solid #F2F3F5}
.lead:first-child{border-top:0}
.lead-m{flex:1;min-width:0}
.lead-n{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.lvl{font-size:11px;line-height:18px;padding:0 6px;border-radius:4px;font-weight:400}
.l-h{background:#FEEDEC;color:#F54741}.l-m{background:#FFF4E6;color:#E8790E}.l-l{background:#F2F3F5;color:#86909C}
.lead-d{font-size:13px;color:var(--t2);margin-top:2px}
.lead-s{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--t3);gap:2px;flex:none}
.lead-btn{flex:none;height:28px;padding:0 12px;border-radius:14px;border:1px solid #BCD0FF;color:var(--blue);font-size:13px;display:inline-flex;align-items:center;gap:3px;transition:.15s;min-width:64px;justify-content:center}
.lead-btn:hover{background:var(--blue-l)}
.lead-btn.done{border-color:transparent;background:#F2F3F5;color:var(--t3)}
.lead-btn .ic{width:13px;height:13px;stroke-width:2.2}
.rev-top{display:flex;gap:32px;align-items:flex-start}
.rev-kpi{flex:none}
.rev-l{font-size:13px;color:var(--t3);display:flex;align-items:center;gap:8px}
.rev-l b{font-size:13px;color:var(--t1);font-weight:600}
.rev-v{font-size:32px;font-weight:600;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums}
.rev-v small{font-size:15px;font-weight:400;color:var(--t2);margin-left:2px}
.rev-c{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--ok);margin-top:4px}
.rev-c .ic{width:13px;height:13px;stroke-width:2.4}
.rev-goal{flex:1;padding-top:2px}
.meter{height:8px;border-radius:4px;background:#EEF1F6;margin:12px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.rev-s{font-size:12px;color:var(--t3)}
.rev-grid{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 4px;padding:14px 0;border-top:1px solid #F2F3F5;border-bottom:1px solid #F2F3F5}
.rev-grid div{display:flex;flex-direction:column;gap:4px;padding:0 14px;border-left:1px solid #F2F3F5}
.rev-grid div:first-child{border-left:0;padding-left:0}
.rev-grid span{font-size:12px;color:var(--t3)}
.rev-grid b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.rev-lines{margin-top:12px}
.rev-lines>.rev-l{margin-bottom:4px}
.rl{display:flex;align-items:center;gap:12px;height:32px;position:relative;cursor:default}
.rl-n{width:76px;font-size:13px;color:var(--t2)}
.rl-bar{flex:1;height:8px;background:#F2F4F7;border-radius:4px;overflow:hidden}
.rl-bar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:background .15s}
.rl:hover .rl-bar i,.fn-r:hover .fn-bar i{background:#1A4FD6}
.rl-v{width:112px;text-align:right;font-size:13px;color:var(--t1);font-variant-numeric:tabular-nums}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:88px;bottom:calc(100% - 4px);background:#1D2129;color:#fff;font-size:12px;line-height:1.5;padding:4px 10px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none}
.prod-sc{position:relative;margin:12px 0 6px}
.prod-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 24px 10px 2px;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.prod-track::-webkit-scrollbar{display:none}
.prod{flex:none;width:340px;background:#fff;border-radius:18px;padding:16px 20px 20px;scroll-snap-align:start;box-shadow:0 4px 20px rgba(40,60,120,.06);border:1px solid #F0F1F5}
.prod-shop{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--t2)}
.prod-shop>.ic{width:16px;height:16px;color:var(--blue)}
.prod-shop .ell{flex:1}
.prod-shop a{display:inline-flex;align-items:center;font-size:12px;color:var(--t3);flex:none}
.prod-shop a .ic{width:13px;height:13px}
.prod-shop a:hover{color:var(--blue)}
.prod-m{display:flex;gap:16px;margin-top:14px}
.prod-img{width:116px;height:116px;border-radius:10px;background:#F6F6F8;flex:none;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-i{flex:1;min-width:0;display:flex;flex-direction:column}
.prod-n{font-size:17px;font-weight:600;line-height:1.45}
.prod-no{font-size:14px;color:var(--t2);margin-top:6px}
.prod-pr{margin-top:auto;display:flex;align-items:baseline;gap:6px}
.prod-pr b{font-size:21px;font-weight:600}
.prod-pr s{font-size:13px;color:#A6ACB6}
.prod-buy{width:100%;height:44px;margin-top:16px;border-radius:10px;background:#DCE6FF;color:var(--blue);font-size:17px;font-weight:500;transition:.15s}
.prod-buy:hover{background:var(--blue);color:#fff}
.sc-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;color:var(--t1)}
.sc-btn.l{left:-14px}.sc-btn.r{right:-10px}
.prod-sc:hover .sc-btn{opacity:1}
.order{width:380px;background:#fff;border-radius:18px;padding:18px 20px 20px;box-shadow:0 4px 20px rgba(40,60,120,.06);border:1px solid #F0F1F5;margin:6px 0}
.od-h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600}
.od-ic{width:22px;height:22px;border-radius:50%;border:2px solid #FF8A1F;color:#FF8A1F;display:flex;align-items:center;justify-content:center;flex:none}
.od-ic .ic{width:13px;height:13px;stroke-width:2.4}
.od-ic.ok{border-color:var(--ok);color:#fff;background:var(--ok)}
.od-p{display:flex;gap:14px;margin-top:14px}
.od-img{width:120px;height:120px;border-radius:10px;background:#F6F6F8;overflow:hidden;flex:none}
.od-img img{width:100%;height:100%;object-fit:cover}
.od-info{flex:1;display:flex;flex-direction:column;min-width:0}
.od-n{font-size:16px;font-weight:600;line-height:1.45}
.od-no{font-size:14px;color:var(--t2);margin-top:4px}
.od-pr{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.od-pr b{font-size:21px;font-weight:600}
.od-q{font-size:14px;color:var(--t2)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:24px;height:24px;border-radius:6px;font-size:17px;line-height:1;color:var(--t1);display:flex;align-items:center;justify-content:center}
.stepper button:hover:not(:disabled){background:#F2F3F5}
.stepper button:disabled{color:var(--t4)}
.stepper span{min-width:36px;height:28px;line-height:28px;text-align:center;background:#F2F3F5;border-radius:6px;font-size:15px;font-variant-numeric:tabular-nums}
.od-rows{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.od-rows>div{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;font-size:14px}
.od-rows>div>span:first-child{color:var(--t1);flex:none}
.od-rows>div>span:last-child{color:var(--t3);text-align:right}
.od-addr{line-height:1.6}
.red{color:#F5483B!important}
.od-rows .od-total{align-items:center}
.od-total .big{font-size:24px;font-weight:600}
.od-btns{display:flex;gap:12px;margin-top:18px}
.ob{flex:1;height:44px;border-radius:10px;font-size:16px;transition:.15s}
.ob.gray{background:#F2F3F5;color:var(--t1)}
.ob.gray:hover{background:#E8EAED}
.ob.blue{background:#DCE6FF;color:var(--blue);font-weight:500}
.ob.blue:hover{background:var(--blue);color:#fff}
.ob.light{background:#EEF3FF;color:var(--blue)}
.policy{width:400px;max-width:100%;background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 4px 20px rgba(40,60,120,.06);border:1px solid #F0F1F5;margin:10px 0}
.po-t{font-size:17px;font-weight:600}
.po-s{font-size:13px;color:var(--t3);margin-top:4px}
.po-f{display:flex;align-items:center;gap:12px;margin:14px -8px 0;cursor:pointer;border-radius:10px;padding:6px 8px}
.po-f:hover{background:#F7F8FA}
.dcard.sf,.dcard.es,.dcard.ag,.dcard.cl{max-width:460px}
.sf-r{display:flex;align-items:center;justify-content:space-between;height:46px;border-top:1px solid #F2F3F5;font-size:15px}
.sf-f{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:14px}
.sf-f b{font-size:18px}
.dcard.done{display:flex;align-items:center;gap:14px}
.sf-ok{width:40px;height:40px;border-radius:50%;background:var(--ok-l);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.sf-ok .ic{width:20px;height:20px;stroke-width:2.4}
.dcard.done b{font-size:15px}
.dcard.done p{margin:2px 0 0;font-size:13px;color:var(--t3)}
.tl{display:flex;flex-direction:column;padding:14px 18px 4px}
.tl-i{display:flex;gap:12px;position:relative;padding:4px 0 16px}
.tl-i:not(:last-child)::after{content:"";position:absolute;left:9px;top:26px;bottom:2px;width:2px;background:#ECEEF2}
.tl-i.done:not(:last-child)::after{background:#BDE8D5}
.tl-dot{width:20px;height:20px;border-radius:50%;border:2px solid #D5D9E0;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;margin-top:1px}

.ag{padding:6px 18px}

.pl-n{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;transition:color .15s}
.pl-d{font-size:13px;color:var(--t2);margin-top:3px}
.pl-p{font-size:13px;color:var(--t3);flex:none}
.pl-go{display:inline-flex;align-items:center;font-size:14px;color:var(--blue);flex:none}
.pl-go .ic{width:14px;height:14px}

.es-r{display:flex;justify-content:space-between;height:42px;align-items:center;border-top:1px solid #F2F3F5;font-size:14px}
.es-r span{color:var(--t3)}
.es-r b{font-weight:500}
.muted{color:var(--t3)}
.plan{background:#fff;border:1px solid #EEF0F4;border-radius:14px;padding:14px 16px 8px;margin:10px 0 12px;max-width:520px}
.plan-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:15px}

.plan-h span{margin-left:auto;font-size:12px;color:var(--t3)}
.plan-h .ic{width:16px;height:16px;color:var(--t2)}
.plan.stopped .plan-h span{color:var(--warn)}
.pl-step{display:flex;gap:12px;padding:8px 0;position:relative}
.pl-step:not(:last-child)::after{content:"";position:absolute;left:10px;top:31px;bottom:-7px;width:1px;background:#E5E6EB}
.ps-ic{width:21px;height:21px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid #D5D9E0;background:#fff;position:relative;z-index:1}
.pl-step.ok .ps-ic{background:var(--ok);border-color:var(--ok);color:#fff}
.pl-step.ok .ps-ic .ic{width:12px;height:12px;stroke-width:2.6}
.pl-step.run .ps-ic{border-color:transparent}
.pl-step.run .spin{width:17px;height:17px;border-top-color:var(--blue)}
.ps-n{font-size:15px;color:var(--t1)}
.pl-step.todo .ps-n{color:var(--t3)}
.ps-tool{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--t3)}
.ps-tool span{background:#F5F6F8;border-radius:4px;padding:1px 6px}
.ps-tool em{font-style:normal;color:var(--t2)}
.fn-r{display:grid;grid-template-columns:44px 1fr 72px 92px;align-items:center;gap:12px;height:34px}
.fn-n{font-size:13px;color:var(--t2)}
.fn-bar{height:10px;background:#F2F4F7;border-radius:5px;overflow:hidden}
.fn-bar i{display:block;height:100%;border-radius:5px;background:var(--blue);transition:background .15s}
.fn-v{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.fn-c{font-size:12px;color:var(--t3)}
.fn-r[data-tip]:hover::after{left:56px}
.cl{display:flex;align-items:center;gap:12px}
.cl-ic{width:36px;height:36px;border-radius:10px;background:var(--warn-l);color:var(--warn);display:flex;align-items:center;justify-content:center;flex:none}
.cl-m{flex:1;min-width:0}
.cl-m b{display:block;font-size:15px;font-weight:500}
.cl-m small{font-size:12px;color:var(--t3)}

/* ============ 侧栏面板 ============ */
.side{width:0;flex:none;overflow:hidden;background:#fff;transition:width .28s ease;position:relative;z-index:3;height:100%}
.page.has-panel .side{box-shadow:-8px 0 30px rgba(40,60,120,.07)}
.page.has-panel .side.w-doc{width:min(50%,760px)}
.page.has-panel .side.w-src{width:460px}
.page.panel-max .side{width:100%!important}
.page.panel-max>.col-main,.page.panel-max>.cpanel{display:none}
.sp{height:100%;display:flex;flex-direction:column;min-width:400px}
.sp-h{display:flex;align-items:center;gap:10px;height:64px;padding:0 16px 0 24px;border-bottom:1px solid #F0F1F4;flex:none}
.sp-title{flex:1;font-size:18px;font-weight:600;min-width:0}

.sp-acts>button:not(.ib):hover{background:#F5F6F8;color:var(--t1)}

.sp-b{flex:1;overflow-y:auto}
.doc{padding:28px 36px 56px;font-size:16px;line-height:1.9;color:#2A2F3A;max-width:880px}

.doc h2{font-size:23px;margin:30px 0 12px;color:var(--t1)}
.doc h3{font-size:19px;margin:20px 0 8px;color:var(--t1)}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{padding-left:22px;margin:0 0 12px}
.doc li{margin:6px 0}
.doc>table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 16px}
.doc>table th,.doc>table td{border:1px solid #E5E6EB;padding:9px 12px;text-align:left}
.doc>table th{background:#F7F8FA;font-weight:500}
.doc-meta{color:var(--t3);font-size:13px;margin:-14px 0 18px!important}
.slides{display:grid;gap:16px}
.slide{position:relative;aspect-ratio:16/9;border-radius:12px;border:1px solid #E5E6EB;padding:28px 32px;background:#fff;display:flex;flex-direction:column;justify-content:center}
.slide.cover{background:linear-gradient(135deg,#2B6BFF,#7B5CF5);color:#fff;border:0}
.sl-k{font-size:13px;color:var(--t3);letter-spacing:1px}
.slide.cover .sl-k{color:rgba(255,255,255,.7)}
.sl-t{font-size:26px;font-weight:600;margin:8px 0;line-height:1.3}
.sl-d{font-size:15px;color:var(--t2);line-height:1.6}

.sl-no{position:absolute;right:16px;bottom:12px;font-size:12px;color:var(--t3)}
.slide.cover .sl-no{color:rgba(255,255,255,.6)}
.img-prev{padding:4px 0}
.img-ph{aspect-ratio:16/10;border-radius:12px;background:linear-gradient(135deg,#EEF3FF,#F6EEFF);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t3);font-size:14px}
.img-ph .ic{width:40px;height:40px;stroke-width:1.2}
.src-list{padding:12px 16px 24px}
.src{padding:16px;border-radius:14px;cursor:pointer;transition:background .15s}
.src+.src{margin-top:4px}
.src:hover{background:#F6F7F9}
.src-r{display:flex;align-items:center;gap:8px}
.src-site{width:16px;height:16px;border-radius:4px;background:#F5483B;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;flex:none}
.src-sn{font-size:14px;color:var(--t2)}
.src-d{font-size:14px;color:var(--t3)}
.src-n{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:#F2F3F5;color:var(--t2);font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.src-t{font-size:16px;font-weight:600;line-height:1.5;color:var(--t1);margin-top:8px}
.src-r .src-t{margin-top:0;flex:1}
.src-ex{font-size:14px;color:#A0A6B1;line-height:1.7;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ============ 浮层 ============ */

.cp-sec{display:flex;align-items:baseline;gap:8px;margin:18px 0 12px;font-size:16px}

.cp-btn.add::before{left:6px;right:6px;top:10px;height:2px}
.cp-btn.add::after{top:6px;bottom:6px;left:10px;width:2px}
.cp-btn.add.dis{background:#C3D3FF;cursor:not-allowed}
.cp-btn.add.dis:hover{transform:none}
.cp-empty{font-size:13px;color:var(--t3);padding:12px 4px}
.shake{animation:shake .4s}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 12px 30px rgba(40,60,120,.2);opacity:.96;transform:rotate(1deg);margin:0}

body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.am-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 24px 26px}

.pop{position:fixed;z-index:200;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.pop.in{opacity:1;transform:none}
.menu{min-width:168px;background:#fff;border-radius:12px;border:1px solid var(--b1);box-shadow:0 12px 30px rgba(15,23,42,.12);padding:6px}

.tpl-img{width:44px;height:44px;border-radius:10px}

.tpl small{display:block;font-size:13px;color:var(--k3);margin-top:2px}
.cron-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cron-card{background:#fff;border:1px solid #EEF0F3;border-radius:14px;padding:18px 18px 14px 20px;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.cron-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.05)}
.cr-h{display:flex;align-items:center;gap:10px}
.cr-h b{font-size:18px;font-weight:500;color:var(--k1);flex:0 1 auto}
.cr-d{margin:12px 0 0;font-size:14px;color:var(--k3);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:46px}
.cr-f{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--b1);font-size:13px;color:var(--k2)}
.cr-f span{display:inline-flex;align-items:center;gap:6px}
.cr-f .ic{width:15px;height:15px;stroke-width:1.5}
.cron-card.off .cr-h b,.cron-card.off .cr-d,.cron-card.off .cr-f{color:var(--k4)}
.ftable.log{background:#fff;border:1px solid #EEF0F3;border-radius:14px;overflow:hidden;flex:none}
.ftable.log .ft-h,.ftable.log .ft-r{grid-template-columns:1.6fr 1fr .8fr .8fr .8fr;padding:0 20px}
.ftable.log .ft-h{background:var(--f2)}
.ftable.log .ft-body{padding-bottom:0;overflow:visible}
.ft-r.static{cursor:default}
.ex-card{background:#fff;border:1px solid #EEF0F3;border-radius:14px;padding:20px;display:flex;flex-direction:column;transition:.2s}
.ex-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.05)}
.ex-top{display:flex;align-items:center;gap:12px}
.ex-av{width:44px;height:44px;border-radius:50%}
.ex-nm b{display:block;font-size:16px;font-weight:500;color:var(--k1)}
.ex-nm small{font-size:12px;color:var(--k3)}
.ex-card p{font-size:14px;color:var(--k2);line-height:1.6;margin:14px 0 12px;flex:1}
.ex-chips{display:flex;flex-wrap:wrap;gap:6px}
.ex-chips span{font-size:12px;line-height:22px;padding:0 8px;background:var(--f3);border-radius:4px;color:var(--k2)}
.ex-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.insp{background:#fff;border:1px solid #EEF0F3;border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}
.insp:hover{box-shadow:0 6px 18px rgba(0,0,0,.06);transform:translateY(-2px)}
.insp-cv{height:118px;position:relative;padding:18px;color:#fff;font-size:18px;font-weight:600;line-height:1.4;overflow:hidden}
.insp-cv span{position:relative;z-index:1;display:block;max-width:82%}
.insp-i1,.insp-i2{position:absolute;border-radius:16px;background:rgba(255,255,255,.2)}
.insp-i1{width:90px;height:90px;right:-20px;bottom:-30px;transform:rotate(18deg)}
.insp-i2{width:50px;height:50px;right:56px;top:-18px;transform:rotate(-12deg)}
.insp-b{padding:14px 16px 16px}
.insp-b b{font-size:15px;font-weight:500;color:var(--k1)}
.insp-b p{font-size:13px;color:var(--k2);margin:6px 0 12px}
.insp-f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--k2)}
.insp-av{width:22px;height:22px;border-radius:50%}

/* ============ 帮助中心 ============ */
.help-page{flex-direction:column}
.help-sc{flex:1;overflow-y:auto}
.help{width:min(880px,calc(100% - 64px));margin:0 auto;padding:56px 0 48px}
.help-hero h1{font-size:30px;margin:0}
.help-hero p{color:var(--t2);margin:8px 0 20px;font-size:15px}
.help-search{display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(40,60,120,.06);color:var(--t3)}
.help-search input{flex:1;border:0;outline:0;font-size:15px;background:none;color:var(--t1)}
.help-cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.hc{background:rgba(255,255,255,.8);border-radius:16px;padding:18px;cursor:pointer;transition:.2s}
.hc:hover{background:#fff;box-shadow:0 6px 18px rgba(40,60,120,.08)}
.hc-ic{width:36px;height:36px;border-radius:10px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center}
.hc b{display:block;margin-top:12px;font-size:15px}
.hc small{font-size:12px;color:var(--t3)}
.help-sec{margin-top:24px;background:rgba(255,255,255,.82);border-radius:16px;padding:8px 22px}
.help-sec h3{font-size:16px;margin:14px 0 6px}
.faq{border-top:1px solid #EEF0F4;cursor:pointer}
.faq:first-child{border-top:0}
.faq-q{display:flex;align-items:center;justify-content:space-between;height:52px;font-size:15px}
.faq-q .ic{width:16px;height:16px;color:var(--t3);transition:transform .2s}
.faq.open .faq-q .ic{transform:rotate(180deg)}
.faq-a{display:none;padding:0 0 16px;font-size:14px;color:var(--t2);line-height:1.8}
.faq.open .faq-a{display:block}
.help-cs{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,#EAF1FF,#F3EDFF)}
.help-cs b{display:block;font-size:16px}
.help-cs span{font-size:13px;color:var(--t2)}

/* ============ 动画 ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes batchIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes wave{0%,100%{height:6px}50%{height:20px}}
@keyframes btnPulse{0%{box-shadow:0 0 0 0 rgba(0,0,0,.35)}100%{box-shadow:0 0 0 18px rgba(0,0,0,0)}}
.dots{display:inline-flex;gap:3px;margin-left:2px;align-items:center}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #E5E6EB;border-top-color:var(--k1);animation:spin .7s linear infinite;flex:none}
@media (max-height:760px){.home{padding-top:24px}.hero{height:160px}}

.page.has-panel .copy{display:none}
.page.has-panel .dock{padding-left:20px;padding-right:20px}
.page.has-panel .chat-in{width:calc(100% - 40px)}
/* 文件空间 + 预览面板并排时压缩表格与工具栏 */
.files-page.has-panel .ft-h,.files-page.has-panel .ft-r{grid-template-columns:36px minmax(0,1fr) 84px 40px}
.files-page.has-panel .ft-time{display:none}
.files-page.has-panel .storage{display:none}
.files-page.has-panel .kp-bar .ksearch{width:150px}
.files-page.has-panel .kp-bar .kbtn{font-size:0;gap:0;padding:0 10px}
.files-page.has-panel .kp-bar .kbtn .ic{width:18px;height:18px}
.files-page.has-panel .ktabs{gap:18px}
.files-page.has-panel .ktab{font-size:16px}
.files-page.has-panel .batch{transform:translateX(-50%) scale(.92)}

/* ============ 细节优化 ============ */
.prod-sc.at-start .sc-btn.l,.prod-sc.at-end .sc-btn.r{opacity:0!important;pointer-events:none}
.to-bottom{position:absolute;left:50%;top:-50px;z-index:3;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #ECEEF3;box-shadow:0 6px 18px rgba(41,72,152,.12);display:flex;align-items:center;justify-content:center;color:var(--t2);opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity .2s,transform .2s,color .15s}
.to-bottom .ic{width:18px;height:18px}
.to-bottom.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.to-bottom:hover{color:var(--t1)}

function pickResponse(text, skill) {
  const q = text || '';
  if (!skill && FOLLOW[q]) return FOLLOW[q]();
  if (skill) {
    const m = {
      cssc: () => R.specs(q.replace(/(的|参数|屏幕|配置|查一下|帮我查)/g, ' ').trim().slice(0, 30)),
      mtm: () => R.mtm((q.match(/[0-9A-Z]{6,12}/i) || [])[0]), zlzz: R.materials, fkmx: R.rebateDetail, jlzc: R.policyList,
      cpcx: () => R.buy('为你找到 3 款相关产品，均支持伙伴专享价：'), rzzn: R.cert, xymb: R.templates, dzq: R.esign,
      kctj: R.courses, xpsx: R.courses, rzks: R.exam, bxcx: R.warranty, bxgd: R.ticket, hdfa: R.schoolPromo, yxwa: R.copywriting,
    }[skill];
    if (m) return m();
  }
  const has = re => re.test(q);
  if (has(/下单|订单/) && has(/【.+】/)) { const k = Object.keys(PRODUCTS).find(k => q.includes(PRODUCTS[k].name)) || 'x1law'; return R.order(k); }
  if (has(/线索/)) return R.leads();
  if (has(/营收|收入|业绩|销售额|经营情况|活动效果/)) return R.revenue();
  if (has(/购买|采购|选购|买|整机|thinkpad|x1|扬天.*(新品|产品)/i) && !has(/参数|配置|MTM|对比/i)) return R.buy();
  if (has(/需求文档|PRD|产品文档/i)) return R.prd();
  if (has(/返利.*核算|核算.*返利|算.*返利/)) return R.rebateCalc();
  if (has(/返款|核销/)) return R.rebateDetail();
  if (has(/星火|解读政策|样机折让/)) return R.policy();
  if (has(/政策|激励/)) return R.policyList();
  if (has(/对比|M4|M6/)) return R.compare();
  if (has(/医院|方案初稿/)) return R.hospital();
  if (has(/电子签|资质材料/)) return has(/发起/) ? R.esign() : R.esignDocs();
  if (has(/开学|活动机制|活动方案/)) return R.schoolPromo();
  if (has(/聚焦|重点内容/)) return R.focus();
  if (has(/积分/)) return R.points();
  if (has(/拜访/)) return R.visit();
  if (has(/销量|填报/)) return R.salesForm();
  if (has(/商机/)) return R.opps();
  if (has(/认证/)) return has(/考试|报名|中级/) ? R.exam() : R.cert();
  if (has(/协议/)) return R.agree();
  if (has(/签约进度|签约/)) return R.signprog();
  if (has(/课程|培训|新品速学/)) return R.courses();
  if (has(/学习进度|学分/)) return R.progress();
  if (has(/MTM/i)) return R.mtm((q.match(/[0-9A-Z]{8,12}/i) || [])[0]);
  if (has(/参数/)) return R.specs();
  if (has(/保修/)) return R.warranty();
  if (has(/备件|补货/)) return R.parts();
  if (has(/工单|报修/)) return R.ticket();
  if (has(/文案|话术|海报/)) return R.copywriting();
  return R.generic(q);
}

function cleanTitle(t) {
  const strip = s => s.replace(/^(请|帮我|麻烦|给我|帮忙|我想|我要|把)+/, '').replace(/^(制作|生成|写|做|准备|整理|筛选|撰写)(一份|一个|一套|一篇|个|份)?/, '').replace(/并给出(分析|建议)$/, '').replace(/\s*(PPT|ppt|Excel|excel|文档)$/, '').replace(/[（(]PR[)）]$/, '').trim();
  const m = t.match(/[：:]\s*(.+)$/);
  if (m && m[1].trim().length >= 2) {
    const topic = m[1].trim().replace(/[，。！？,.!?]+$/, '');
    const base = strip(t.split(/[，,：:]/)[0]);
    if (!base || topic.includes(base)) return topic.slice(0, 32);
    return (base.length >= 6 ? `${base}（${topic}）` : topic + base).slice(0, 32);
  }
  return (strip(t.split(/[，,。！？!?；;]/)[0]) || '任务产出').slice(0, 32);
}

/* 按纯文本长度截断 HTML（与逐字输出时的进度一致） */
function truncHTML(html, len) {
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  let n = 0; const drop = [];
  const walk = node => {
    for (const ch of [...node.childNodes]) {
      if (n >= len) { drop.push(ch); continue; }
      if (ch.nodeType === 3) { const t = ch.nodeValue; if (n + t.length > len) ch.nodeValue = t.slice(0, len - n); n += Math.min(t.length, len - n); }
      else if (ch.nodeType === 1) walk(ch);
    }
  };
  walk(tpl.content); drop.forEach(x => x.remove());
  return tpl.innerHTML;
}
const mdPost = h => h.replace(/<pre data-lang="([^"]*)"><code>/g, '<div class="code"><div class="code-h"><span>$1</span><button data-act="copy-code">' + ic('copy') + '复制</button></div><pre><code>').replace(/<\/code><\/pre>/g, '</code></pre></div>');

/* 停止分两种：用户点「停止」= 截断在当前进度；切换页面/会话 = 回答在后台补全 */
const cutStop = g => !!(g && g.user);
async function typeText(el, text, step, g) {
  for (let i = 0; i < text.length;) {
    if (genStopped(g)) { if (!cutStop(g)) el.textContent = text; return; }
    i = Math.min(text.length, i + step); el.textContent = text.slice(0, i); scrollChat(); await sleep(16);
  }
}
const INSTANT = new Set(['TABLE', 'PRE', 'HR', 'IMG', 'SVG']);
async function typeNode(parent, node, g) {
  if (genStopped(g)) { if (!cutStop(g)) parent.appendChild(node.cloneNode(true)); return; }
  if (node.nodeType === 3) {
    const t = document.createTextNode(''); parent.appendChild(t);
    const full = node.nodeValue;
    if (!full.trim()) { t.nodeValue = full; return; }
    for (let i = 0; i < full.length;) {
      if (genStopped(g)) { if (!cutStop(g)) t.nodeValue = full; return; }
      i = Math.min(full.length, i + 2); t.nodeValue = full.slice(0, i); scrollChat(); await sleep(14);
    }
    return;
  }
  if (node.nodeType !== 1) return;
  if (INSTANT.has(node.tagName) || node.classList.contains('tbl-wrap') || node.classList.contains('code') || node.classList.contains('draft')) {
    const c = node.cloneNode(true); c.classList.add('fade-up'); parent.appendChild(c); scrollChat(); await sleep(220); return;
  }
  const c = node.cloneNode(false); parent.appendChild(c);
  for (const ch of [...node.childNodes]) await typeNode(c, ch, g);
}
function genStopped(g) { return !g || g.stop || S.gen !== g; }
/* 把回答里（前 n 个卡片中）需要保存的产出物写入文件空间 */
function saveFiles(m, n = m.resp.blocks.length) {
  m.resp.blocks.slice(0, n).forEach(b => { if (b.t === 'files') b.items.forEach(f => { if (f.save && !f.saved) { f.saved = true; addOutputFile(f); } }); });
}
async function respond(conv, resp, src) {
  const m = { id: uid('m'), role: 'ai', resp, st: {}, src };
  conv.msgs.push(m); conv.time = nowStr();
  refreshHist();
  const inEl = chatIn();
  // 用户已切到别的会话：回答直接在后台完成，不渲染到当前页面
  if (!inEl || curConv() !== conv) { saveFiles(m); if (conv.scope === 'claw') { conv.unread = true; refreshHist(); } return; }
  $$('.follow', inEl).forEach(x => x.remove());
  const el = document.createElement('div'); el.className = 'msg a'; el.id = m.id; inEl.appendChild(el);
  await runAnimation(m, el, conv);
}
async function runAnimation(m, el, conv) {
  const g = S.gen = { mid: m.id, stop: false }; S.autoScroll = true; setSendState();
  const r = m.resp; m.stopped = false; m.cut = null; m.st.planCut = null;
  let n = 0, thinkN = 0, inThink = !!r.think, planK = null, complete = false;
  try {
    if (r.think) {
      el.innerHTML = `<div class="think"><div class="think-h"><span class="think-ic"></span><span class="think-l">思考中</span><span class="dots"><i></i><i></i><i></i></span></div><div class="think-b">${r.think.steps ? '<ul class="think-steps"></ul>' : ''}${r.think.text ? '<div class="think-t"></div>' : ''}</div></div><div class="a-body"></div>`;
      scrollChat();
      const ul = $('.think-steps', el);
      for (const s of r.think.steps || []) {
        if (genStopped(g)) break;
        const li = document.createElement('li'); li.className = 'cur'; li.textContent = s; ul.appendChild(li); thinkN++; scrollChat();
        await sleep(620); li.className = 'ok';
      }
      if (r.think.text && !genStopped(g)) await typeText($('.think-t', el), r.think.text, 3, g);
      if (!genStopped(g)) await sleep(240);
      if (!genStopped(g)) inThink = false;
      const th = $('.think', el); th.classList.add('done');
      th.querySelector('.think-l').textContent = r.think.label || '思考完成';
      const dots = th.querySelector('.dots'); if (dots) dots.outerHTML = ic('chevU', 'think-chev');
      th.querySelector('.think-h').dataset.act = 'think-toggle'; th.querySelector('.think-h').dataset.mid = m.id;
    } else el.innerHTML = '<div class="a-body"></div>';
    const body = $('.a-body', el);
    for (let i = 0; i < r.blocks.length; i++) {
      if (genStopped(g)) break;
      const b = r.blocks[i]; n = i + 1;
      const w = document.createElement('div'); w.className = 'blk'; w.dataset.blk = m.id + ':' + i; body.appendChild(w);
      if (b.t === 'md') {
        const tpl = document.createElement('template'); tpl.innerHTML = mdPost(b.html);
        const md = document.createElement('div'); md.className = 'md'; w.appendChild(md);
        for (const nd of [...tpl.content.childNodes]) await typeNode(md, nd, g);
      } else if (b.t === 'plan') {
        m.st.planIdx = 0; m.st.planRun = true;
        w.innerHTML = blockHTML(b, m, i); w.classList.add('fade-up'); scrollChat();
        for (let k = 0; k < b.steps.length; k++) {
          if (genStopped(g)) break;
          await sleep(900); if (genStopped(g)) break;
          m.st.planIdx = k + 1; w.innerHTML = blockHTML(b, m, i); scrollChat();
        }
        if (genStopped(g)) planK = m.st.planIdx;
        m.st.planIdx = null; m.st.planRun = false;
      } else { w.innerHTML = blockHTML(b, m, i); w.classList.add('fade-up'); scrollChat(); await sleep(380); }
    }
    complete = !genStopped(g);
  } finally {
    m.st.planIdx = null; m.st.planRun = false;
    const user = cutStop(g) && !complete;
    if (user) {
      // 用户手动停止：记录停止时的进度，之后重新渲染也保持截断状态
      const lastB = r.blocks[n - 1], mdEl = n ? $(`[data-blk="${m.id}:${n - 1}"] .md`, el) : null;
      m.stopped = true;
      m.cut = { n, len: lastB && lastB.t === 'md' && mdEl ? mdEl.textContent.length : null, think: inThink ? thinkN : null };
      if (planK != null) m.st.planCut = planK;
    }
    if (S.gen === g) { S.gen = null; setSendState(); }
    saveFiles(m, user ? n : r.blocks.length);
    if (el.isConnected) {
      const last = [...conv.msgs].reverse().find(x => x.role === 'ai');
      el.innerHTML = aiHTML(m, m === last);
      const ext = $('.a-ext', el); if (ext) ext.classList.add('fade-up');
      scrollChat();
    } else if (conv.scope === 'claw' && curConv() !== conv) { conv.unread = true; refreshHist(); }

/* ---------- 文件空间 ---------- */
function findNode(id, node = FILE_TREE, parent = null) {
  if (node.id === id) return [node, parent];
  for (const c of node.children || []) { const r = findNode(id, c, node); if (r[0]) return r; }
  return [null, null];
}
function curFolder() { const p = S.claw.files.path; return p.length ? findNode(p[p.length - 1])[0] || FILE_TREE : FILE_TREE; }
function allFiles(node = FILE_TREE, acc = []) { for (const c of node.children || []) { acc.push(c); if (c.children) allFiles(c, acc); } return acc; }
function treeSize(node = FILE_TREE) { return (node.children || []).reduce((s, c) => s + (c.children ? treeSize(c) : (c.size || 0)), 0); }
function addOutputFile(f) {
  const [out] = findNode('f-out');
  const bytes = parseFloat(f.size) * (/MB/.test(f.size) ? 1048576 : 1024);
  out.children.unshift({ id: uid('f'), name: f.name, type: f.type, size: Math.round(bytes), time: nowStr(), doc: f.doc });
}
function filesPage() {
  const f = S.claw.files, inQA = S.mode === 'qa';

      <div class="ksearch">${ic('search')}<input id="fs-q" placeholder="输入文件名称搜索" value="${esc(f.q)}" autocomplete="off"></div>

}
const usedMB = () => 240 + treeSize() / 1048576 * 0.18;
function fsItems() {
  const f = S.claw.files, folder = curFolder();
  let items = f.q.trim() ? allFiles().filter(x => x.name.toLowerCase().includes(f.q.trim().toLowerCase())) : [...folder.children];
  items.sort((a, b) => {
    if (!!a.children !== !!b.children) return a.children ? -1 : 1;
    if (!f.sortKey) return 0;
    const va = f.sortKey === 'size' ? (a.size || 0) : a.time, vb = f.sortKey === 'size' ? (b.size || 0) : b.time;
    return (va > vb ? 1 : va < vb ? -1 : 0) * f.sortDir;
  });
  return items;
}

/* ---------- 定时任务 ---------- */
const WD = ['', '一', '二', '三', '四', '五', '六', '日'];
function freqText(t) { return { day: '每天 ', workday: '工作日 ', week: `每周${WD[t.wd || 1]} `, once: '仅一次 ' }[t.freq] + t.time; }
function nextRun(t) {
  const now = new Date(), [h, mi] = t.time.split(':').map(Number);
  for (let d = 0; d < 8; d++) {
    const c = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, h, mi);
    if (c <= now) continue;
    const wd = c.getDay() || 7;
    if (t.freq === 'workday' && wd > 5) continue;
    if (t.freq === 'week' && wd !== (t.wd || 1)) continue;
    const lab = d === 0 ? '今天' : d === 1 ? '明天' : `周${WD[wd]}`;
    return `${lab} ${t.time}`;
  }
  return '—';
}
function cronCard(t) {
  const st = { running: ['执行中', 'run'], ok: ['上次执行成功', 'ok'], fail: ['上次执行失败', 'fail'], wait: ['等待执行', 'base'] }[t.status];
  return `<div class="cron-card ${t.on ? '' : 'off'}" data-act="cron-edit" data-id="${t.id}"><div class="cr-h"><b class="ell">${esc(t.name)}</b>${st && t.on ? `<span class="ktag ${st[1]}">${st[0]}${t.status === 'running' ? '<span class="dots"><i></i><i></i><i></i></span>' : ''}</span>` : ''}<span class="fx"></span>
    <button class="switch ${t.on ? 'on' : ''}" data-act="cron-toggle" data-id="${t.id}" title="${t.on ? '暂停' : '启用'}"><i></i></button><button class="ib sm" data-act="cron-menu" data-id="${t.id}" title="更多">${ic('more')}</button></div>
    <p class="cr-d">${esc(t.desc)}</p><div class="cr-f"><span>${ic('calendar')}${freqText(t)}</span>${t.on ? `<span>下次执行：${nextRun(t)}</span>` : '<span>已暂停</span>'}</div></div>`;
}
function cronPage() {
  const c = S.claw.cron;
  // 预置的「执行中」任务：首次打开页面后几秒内完成，避免一直转圈
  c.tasks.forEach(t => { if (t.status === 'running' && !t.ticking) { t.ticking = true; runCron(t, 6000).then(() => { t.ticking = false; }); } });
  const logs = c.logs || (c.logs = [

  if (!el) {
    const comp = e.target.closest('#composer');
    if (comp && !e.target.closest('textarea')) $('#ta') && $('#ta').focus();
    return;
  }
  if (el.disabled || el.classList.contains('dis') && el.dataset.act !== 'cp-add') return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
}, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ta') { S.cmp.text = t.value; autoGrow(t); setSendState(); return; }
  if (t.id === 'proof-note') { if (S.proof) S.proof.note = t.value; return; }
  if (e.isComposing) return;
  onSearchInput(t);
});
document.addEventListener('compositionend', e => onSearchInput(e.target));
function onSearchInput(t) {
  if (t.id === 'hist-q') { S.qa.histQuery = t.value; refreshHist(); }
  else if (t.id === 'cp-q') { S.claw.histQuery = t.value; refreshHist(); }
  else if (t.id === 'sk-q') { S.claw.skills.q = t.value; $('#sk-grid').innerHTML = skillCards(); }
  else if (t.id === 'fs-q') { S.claw.files.q = t.value; S.claw.files.sel.clear(); refreshFiles(true); }
  else if (t.id === 'gen-ta') S.claw.skills.genText = t.value;
  else if (t.id === 'help-q') $('#faq-list').innerHTML = faqHTML(t.value.trim());
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.id === 'ta') {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
      if (e.altKey || e.ctrlKey || e.metaKey) { e.preventDefault(); const s = t.selectionStart; t.value = t.value.slice(0, s) + '\n' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 1; S.cmp.text = t.value; autoGrow(t); setSendState(); return; }
      if (e.shiftKey) { setTimeout(() => { S.cmp.text = t.value; autoGrow(t); }, 0); return; }
      e.preventDefault();
      if (S.gen) { if (t.value.trim() && Date.now() - (S.genHint || 0) > 2500) { S.genHint = Date.now(); toast('正在生成回答，可先点击停止再发送', 'info'); } return; }
      if (t.value.trim()) sendMessage(t.value); return;
    }
    if (e.key === 'Backspace' && !t.value && S.cmp.skill) { S.cmp.skill = null; refreshComposer(); return; }
  }
  if (t.id === 'rn-input') { if (e.isComposing || e.keyCode === 229) return; if (e.key === 'Enter') { e.preventDefault(); commitRename(t); } if (e.key === 'Escape') { S.claw.files.renaming = null; refreshFiles(); } return; }
  if (t.id === 'cmd-input' && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); ACT['cmd-save'](); return; }
  if (t.id === 'cmd-input' && e.key === 'Escape' && !e.isComposing) { ACT['cmd-cancel'](); return; }   // Esc 只退出编辑，不关闭整个常用指令面板
  if (t.id === 'ren-conv' && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { $('[data-act="ch-rename-ok"]').click(); return; }
  // 弹窗里的单行输入框：回车即提交
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && t.matches && t.matches('.ov input.kinput:not([type=time])')) { const b = $('.dlg-f .kbtn.black, .dlg-f .qbtn.blue', topOverlay()); if (b) { e.preventDefault(); b.click(); } return; }
  if (e.key === 'Escape' && !e.isComposing) {
    if (t.id === 'hist-q' && !POP) { ACT['hist-search-close'](); return; }
    if (t.id === 'cp-q' && !POP) { ACT['cp-search-close'](); return; }
    if (S.listening) { stopListening(); toast('已取消语音输入', 'info'); return; }
    if (POP) closePop();
    else if (S.cmdOpen) { S.cmdOpen = false; S.cmdManage = false; S.cmdEdit = null; renderCmdPop(); }
    else if (OV.length) { if (!lockedTop()) closeOverlay(); }
    else if (S.panel) closePanel();
  }
});
document.addEventListener('focusout', e => { if (e.target.id === 'rn-input') setTimeout(() => commitRename(e.target, true), 0); });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'fs-file' && t.files.length) {
    const folder = curFolder(), list = [];
    [...t.files].forEach(f => { const ext = (f.name.match(/\.[^.]+$/) || [''])[0]; list.push({ id: uid('f'), name: uniqueName(f.name.slice(0, f.name.length - ext.length), [...folder.children, ...list], ext), type: extType(f.name), size: f.size, time: nowStr(), up: 0 }); });
    folder.children.unshift(...list); refreshFiles(); t.value = '';
    for (let p = 0; p <= 100; p += 20) { list.forEach(x => x.up = p); refreshFiles(); await sleep(160); }
    list.forEach(x => delete x.up); refreshFiles(); toast(`已上传 ${list.length} 个文件`);
  }
  if (t.id === 'proof-file' && t.files.length) { S.proof.file = { name: t.files[0].name, p: 0 }; refreshOverlay(proofHTML(S.proof.mid)); proofProgress(S.proof.mid); }
  if (t.id === 'sk-file' && t.files.length) { toast(`已导入技能包：${t.files[0].name}（演示）`); t.value = ''; }
});
/* 商品卡片左右箭头：滚到头/尾时隐藏对应箭头 */
function updProd(sc) {
  const t = $('.prod-track', sc); if (!t) return;
  sc.classList.toggle('at-start', t.scrollLeft <= 4);
  sc.classList.toggle('at-end', t.scrollLeft >= t.scrollWidth - t.clientWidth - 4);
}
document.addEventListener('scroll', e => { const t = e.target; if (t.classList && t.classList.contains('prod-track')) updProd(t.closest('.prod-sc')); }, true);
document.addEventListener('mouseover', e => { const sc = e.target.closest && e.target.closest('.prod-sc'); if (sc) updProd(sc); });
document.addEventListener('wheel', e => {
  const sc = e.target.closest('.chips-sc, .prod-track');
  if (sc && Math.abs(e.deltaY) > Math.abs(e.deltaX) && sc.scrollWidth > sc.clientWidth) { sc.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });

/* ============ 初始化 ============ */
function init() {
  QA_HISTORY.forEach(h => {
    const c = newConv('qa', h.title); c.advisor = h.advisor; c.time = h.time;
    c.msgs = [{ id: uid('m'), role: 'user', text: h.q }, { id: uid('m'), role: 'ai', resp: R[h.r](), st: {}, src: { kind: 'qa', text: h.q } }];
    S.qa.hist.push(c.id);
  });
  initClawHist();
  $('#sb-open').innerHTML = `${img('logo')}<span>${ic('sidebarOpen')}</span>`;
  renderApp();
}
init();

</script>

 document.getElementById('demo-access-form').addEventListener('submit',async event => {

  const digest=Array.from(new Uint8Array(bytes),byte=>byte.toString(16).padStart(2,'0')).join('');
  if(digest==='93d974d472940f364f66f9ed9a1b86d460d6019edc880dad6c2231656bf8a42d'){

   gate.hidden=true;

   document.getElementById('main').focus();
  }else{
   error.textContent='密码不正确，请重新输入。';
   input.setAttribute('aria-invalid','true');
   input.select();
  }
 });
 input.addEventListener('input',()=>{error.textContent='';input.removeAttribute('aria-invalid');});
