<title>蒙牛 · 奶盒出逃计划</title>
<style>
:root {
  color-scheme: light;
  --surface: #eef4ff;
  --paper: #fffdfa;
  --blue: #183a9f;
  --navy: #10275f;
  --ink: #15264c;
  --dim: #53627c;
  --line: #d9e0ed;
  --yellow: #ffdc60;
  --mint: #95e6c4;
  --display: "Arial Rounded MT Bold", "Heiti SC", "PingFang SC", sans-serif;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
  background: var(--surface);
}
*,*::before,*::after { box-sizing: border-box }
body, h1, h2, h3, p { margin: 0 }
button,select { font: inherit }
button { cursor: pointer; border: 0; touch-action: manipulation }
button:disabled { cursor: default; opacity: .48 }
button:focus-visible,select:focus-visible { outline: 3px solid #ea721d; outline-offset: 3px }
p { line-height: 1.6 }
h1,h2,h3 { font-family: var(--display); letter-spacing: -.035em }
h2 { font-size: 26px }
h3 { font-size: 20px }
.small { font-size: 14px }
.dim { color: var(--dim) }
.wrap { width: min(1100px, calc(100% - 48px)); margin-inline: auto }
.top { background: var(--paper); border-bottom: 1px solid #dce5f4 }
.bar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
.brand { display: flex; align-items: center; gap: 11px; min-height: 46px; background: transparent; padding: 0; color: var(--ink); font-weight: 850; white-space: nowrap }
.brand img { width: 48px; height: auto; display: block }
.nav { display: flex; gap: 4px }
.nav button,.bare,.back { min-height: 44px; padding: 0 11px; border-radius: 7px; background: transparent; color: #234787; font-size: 14px; font-weight: 700 }
.nav button.review-btn { background: #e8edfa }
.main { min-height: calc(100dvh - 128px); padding-block: 22px 34px }
.title { font-size: clamp(34px, 5vw, 58px); line-height: 1.06; letter-spacing: -.06em }
.kicker { font-size: 13px; font-weight: 850; line-height: 1.4; letter-spacing: .08em; color: var(--blue) }
.lead { color: var(--dim); max-width: 42ch; margin-top: 12px }
.primary,.secondary,.accent { border-radius: 10px; padding: 12px 17px; min-height: 46px; font-weight: 850 }
.primary { background: var(--blue); color: white }
.accent { background: var(--yellow); color: #242a43 }
.secondary { background: #e9eefb; color: var(--navy) }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 18px }
.hero { display: grid; grid-template-columns: 46% 54%; position: relative; overflow: hidden; border-radius: 22px; background: #111c53; color: white }
.hero-copy { position: relative; z-index: 1; align-self: center; padding: 46px 12px 46px 44px }
.hero .kicker { color: #ffdd70 }
.hero .title { font-size: clamp(42px, 6.3vw, 81px); margin-block: 9px 15px }
.hero .lead { color: #e5ecff; font-size: 16px }
.hero .secondary { background: #24366c; color: white }

.hero-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg,#111c53,transparent 21%) }
.week-plan { display: grid; grid-template-columns: 1.25fr 1fr; column-gap: 40px; align-items: start; margin-top: 24px }
.week-plan>div { padding: 15px 0 }
.week-plan>div+div { border-left: 1px solid #d4dfef; padding-left: 28px }
.week-plan p { margin-top: 5px }
.mini-list { display: grid; gap: 7px; margin-top: 14px }
.mini-list button { text-align:left }
.mini-nav { margin: 19px 0 0; display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid #d4dfef }
.mini-nav strong { margin-right: auto }
.mini-nav button { background: transparent }
.foot { min-height: 58px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; color: var(--dim); font-size: 13px; border-top: 1px solid #d4dfef }
.page { background: var(--paper); max-width: 720px; margin-inline: auto; padding: 24px 30px 32px; border: 1px solid #dce5f4; border-radius: 16px }
.back { margin: -5px 0 8px -9px }
.page .title { margin-top: 7px; font-size: clamp(29px, 4.5vw, 45px) }
.callout { background: #fff1c3; border: 1px solid #eddaa2; color: #3c360f; margin-top: 16px; padding: 13px 15px; border-radius: 9px }
.rows { list-style: none; padding: 0; margin: 9px 0 0 }
.rows li { display: flex; align-items: center; justify-content: space-between; column-gap: 11px; min-height: 66px; padding: 10px 0 }
.rows li+li { border-top: 1px solid var(--line) }
.rows small { display: block; color: var(--dim); line-height: 1.45; margin-top: 3px }
.choose { display: grid; gap: 8px; margin-top: 15px }
.choose button { width: 100%; min-height: 64px; text-align: left; padding: 11px 14px; background: #f2f5fc; color: var(--ink); border: 2px solid transparent; border-radius: 10px }
.choose button[aria-pressed="true"] { border-color: #234bb5; background: #eaf0fe }
.choose strong,.choose small { display: block }
.choose small { margin-top: 5px; color: var(--dim); line-height: 1.45 }
.notice { background: #fceabb; border-bottom: 1px solid #edd58c; font-size: 14px }
.notice .wrap { display: flex; gap: 10px; align-items: center; justify-content: space-between }
.notice button { flex: none }
.dialog { width: min(440px,calc(100% - 24px)); border: 1px solid var(--line); border-radius: 14px; padding: 21px; color: var(--ink); background: var(--paper) }
.dialog::backdrop { background: #132956a8 }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 7px }
.setting { display: grid; gap: 5px; margin-top: 14px; font-size: 14px }
.setting select { min-height: 44px; padding: 7px; border-radius: 8px; border: 1px solid #abb8d5; background: white; color: var(--ink) }
.week-controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px }
.week-controls button { min-height: 44px; background: #e9eefb; color: var(--navy); padding: 6px 10px; border-radius: 8px; font-weight: 750 }
.check { display: flex; gap: 9px; align-items: center; min-height: 44px; margin-top: 10px }
.check input { width: 20px; height: 20px }
.game { display: grid; grid-template-columns: minmax(290px,475px) minmax(230px,1fr); align-items: start; gap: clamp(20px,5vw,72px); max-width: 1030px; margin-inline: auto }
.game-side { padding-top: 18px }
.game-side .title { margin: 8px 0 10px }
.game-side .back { margin-bottom: 7px }
.game-side .actions { margin-bottom: 13px }
.game-side .actions button:first-child { min-width: 142px }
.game-mobile { display: none }
.board-shell { padding: clamp(10px,2vw,20px); border-radius: 17px; background: #142964; color: white; min-width: 0 }
.board-shell.sea { background: #104a59 }
.board-shell.moon { background: #242557 }
.board-shell.freezer { background: #205170 }
.board-top { display: flex; align-items: center; gap: 6px; justify-content: space-between; font-size: 14px; margin-bottom: 11px }
.meter { display: flex; gap: 3px; margin-right: auto; margin-left: 4px }
.meter i { width: 7px; height: 13px; border-radius: 2px; background: #8793b838 }
.meter i.on { background: #fcd85e }
.board { position: relative; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 5px; isolation: isolate }
.tile { aspect-ratio: 1; position: relative; display: grid; place-items: center; min-width: 0; padding: 0; background: #213b78; border-radius: 8px; border: 1px solid #ffffff13; color: white; overflow: hidden }
.sea .tile { background: #195e6c }
.moon .tile { background: #37386b }
.freezer .tile { background: #286987 }
.tile.blank { background: #0a194a55; border: 1px solid #ffffff10 }
.tile.edit { cursor: pointer; border: 2px dashed #f1d367; background-color: #30477b }
.tile.edit:disabled { opacity: 1 }
.tile.edit:active { background-color: #46597e }
.tile.visited { background-color: #2b715e }
.tile.problem { border: 2px solid #ff9a8d; background-color: #663747 }
.tile .arm { position:absolute; background:#aebbd9; width: 14%; height: 58%; left: 43%; top: -4%; transform-origin: 50% 93%; border-inline: 1px solid #edf4ff70 }
.tile.edit .arm { background: #ffdc73; border-color: #fff1ba }
.tile .arm.dir1 { transform: rotate(90deg) }
.tile .arm.dir2 { transform: rotate(180deg) }
.tile .arm.dir3 { transform: rotate(270deg) }
.tile .junction { position:absolute; width: 16%; height: 16%; border-radius: 3px; background: #aebbd9; top:42%;left:42% }
.tile.edit .junction { background: #ffdc73 }
.tile .marker { z-index:1; min-width: 24px; padding: 3px 4px; border-radius: 5px; background: #edf2ff; color: #142d64; font-weight: 850; font-size: clamp(10px,2.5vw,13px); font-style: normal; line-height: 1.25 }
.tile .marker.robot,.tile .marker.octopus { background: #ffd4e6; color: #68244d }
.tile .marker.cell,.tile .marker.relay { background: #a8eace; color: #114639 }
.tile .marker.current { background: #ff9c99; color: #551f2b }
.tile .marker.start,.tile .marker.finish { position: absolute; top: 5px; left: 5px; background: #ffda67; color: #272952 }
.tile .marker.finish { left: auto; right: 5px }
.car { width: 27px; height: 32px; background: #ffdc61; border: 3px solid #fff5cd; position: absolute; top:0;left:0; z-index: 2; border-radius: 7px; transform: translate(-50%,-50%); pointer-events:none; box-shadow: 0 2px 5px #0009 }
.car::before { content: ""; position: absolute; inset:3px 3px 10px; border-radius: 3px; background:#173477 }
.car::after { content: ""; position: absolute; width: 9px; height: 3px; left: 6px; bottom: 4px; border-radius: 3px; background:#173477 }
.board-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-top: 10px; color: #e8eeff; font-size: 12px }
.board-foot span::before { content: "◇"; color: #ffdc67; margin-right: 5px }
.feedback { min-height: 76px; margin-top: 14px; border-radius: 10px; background: #fff1ca; color: #4d3913; padding: 11px 13px; font-size: 14px }
.feedback[data-tone="bad"] { background: #ffe5de; color: #64281f }
.feedback[data-tone="good"] { background: #d9f2e5; color: #154838 }
:focus[data-route-heading] { outline: none }
.route-ticket { border-left: 6px solid #1a479f; background:#ecf1fe; border-radius:9px; padding: 16px 18px; margin-top: 14px }
.route-ticket.sea { border-color: #13767b; background: #dff3ee }
.result-paper { background: #e5edfd; padding: 18px; border-radius:12px; margin-top: 15px }
.result-paper .title { margin: 0 }
.result-paper p { margin-top: 8px }
.bonus-scene { max-width: 270px; height: 148px; position: relative; display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; border-radius: 13px; border: 5px solid #1c3b82; background: #183969 }
.bonus-door { width: 50%; height: 100%; top: 0; position: absolute; background: #bfdbed; border: 2px solid #8fbae1 }
.bonus-door.left { left: 0 }
.bonus-door.right { right: 0 }
.bonus-door::after { content: ""; position: absolute; width: 4px; height: 27px; border-radius: 4px; top: 44%; background: #1d4183 }
.bonus-door.left::after { right: 9px }
.bonus-door.right::after { left: 9px }
.bonus-scene.opened .left { transform: translateX(-102%) }
.bonus-scene.opened .right { transform: translateX(102%) }
.bonus-bot { display: flex; align-items: center; justify-content: space-evenly; width: 76px; height: 72px; margin: auto; border-radius: 17px; border: 4px solid #c9f3ff; background: #83d1ee; box-shadow: inset 0 -9px 0 #66aecf }
.bonus-bot i { background: #173d6a; width: 8px; height: 12px; border-radius: 5px }
.small-buttons { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px }
.small-buttons button { padding: 7px 10px }
.progress { display: flex; align-items: center; gap: 8px; margin-top: 15px }
.progress span { padding: 8px 11px; border: 1px dashed #a9b7d2; border-radius: 7px; color: var(--dim); font-size: 14px }
.progress span.on { background: #d9f2e5; color: #154838; border-color:#a8d2be }
@media (max-width:720px) {
 .wrap { width: calc(100% - 28px) }
 .bar { min-height: 55px; gap: 5px }
 .brand { gap: 5px; font-size: 14px }
 .brand img { width: 32px }
 .nav { gap: 0 }
 .nav button { font-size: 12px; padding-inline: 7px }
 .main { padding-top: 12px }
 .hero { display:flex; flex-direction: column; border-radius: 14px }
 .hero-copy { padding: 23px 22px 13px; align-self: stretch }
 .hero .title { font-size: clamp(42px,12vw,67px); margin-bottom: 10px }
 .hero .lead { font-size: 14px }
 .hero-art { min-height: 0; height: clamp(188px,55vw,310px); background-position:center 54% }
 .hero-art::after { background: linear-gradient(180deg,#111c53,transparent 26%) }
 .week-plan { display: block; margin-top: 9px }
 .week-plan>div+div { padding-left: 0; border-left: 0; border-top: 1px solid #d4dfef }
 .page { padding: 17px 16px 21px; border-radius:12px }
 .page .title { font-size: 33px }
 .actions { margin-top: 14px }
 .game { display:flex; flex-direction: column; gap: 0; max-width: 475px }
 .game>div,.game>section { width: 100% }
 .game-mobile { display: block; padding-bottom: 10px }
 .game-mobile .back { margin-bottom: 1px; min-height: 36px }
 .game-mobile .title { font-size: 28px; margin: 3px 0 2px }
 .game-mobile .kicker { font-size: 11px }
 .game-mobile .lead { font-size: 13px; margin-top: 3px }
 .game-copy { display: none }
 .game-side { padding-top: 0 }
 .game-side .actions { margin-block: 10px 7px }
 .game-side .actions button:first-child { margin-right: auto }
 .feedback { min-height: 56px; margin-top: 6px }
 .tile { border-radius: 6px }
}
@media (max-width:350px) {
 .wrap { width: calc(100% - 20px) }
 .brand img { width: 28px }
 .nav button { padding-inline:5px }
 .actions button { padding-inline: 11px }
}
@media (prefers-reduced-motion:reduce) {
 *,*::before,*::after { scroll-behavior:auto !important }
}
</style>

<script>
const Rail = (() => {
  const north = 0;
  const east = 1;
  const south = 2;
  const west = 3;
  const names = ['上', '右', '下', '左'];
  const deltas = [-4, 1, 4, -1];

  function direction(from, to) {
    return deltas.indexOf(to - from);
  }

  function makeBoard(id, options) {
    const { short, long, editable, markers, energy, extra = {} } = options;
    const start = short[0];
    const finish = short.at(-1);
    const cells = Array.from({ length: 16 }, () => null);

    for (const path of [short, long]) {
      for (let step = 1; step < path.length - 1; step++) {
        const position = path[step];
        cells[position] = {
          connections: [direction(position, path[step - 1]), direction(position, path[step + 1])],
          turn: editable.includes(position),
          tag: markers[position] || ''
        };
      }
    }

    cells[start] = {
      connections: [direction(start, short[1]), direction(start, long[1])],
      turn: true,
      tag: 'start'
    };
    cells[finish] = {
      connections: [direction(finish, short.at(-2)), direction(finish, long.at(-2))],
      turn: false,
      tag: 'finish'
    };
    return { id, ...options, start, finish, energy, cells, ...extra };
  }

  const tutorial = {
    title: '电梯失控了',
    instruction: '把起点朝向上方，接好出口前的弯轨。也可以走下方，接上机器人和电池再去出口。',
    short: [4, 0, 1, 2, 3, 7],
    long: [4, 8, 9, 13, 14, 15, 11, 7],
    energy: 6,
    editable: [3, 15],
    markers: { 13: 'robot', 14: 'cell' }
  };
  const moon = {
    title: '月球 · 接通信号塔',
    instruction: '出口等着信号塔通电。上方可以直达，下方能经过维修车，留意电量和发光的信号塔。',
    short: [12, 8, 4, 0, 1, 2, 3],
    long: [12, 13, 14, 10, 9, 5, 6, 7, 3],
    energy: 7,
    editable: [1, 14, 7],
    markers: { 1: 'relay', 9: 'cell', 5: 'robot', 6: 'relay' },
    extra: { needsSignal: true }
  };
  const sea = {
    title: '深海 · 穿过暗流',
    instruction: '短线有暗流。先打开排水闸再发车，或走另一条路，经过海底电池和等车的章鱼。',
    short: [0, 4, 8, 12, 13, 14, 15],
    long: [0, 1, 2, 6, 5, 9, 10, 11, 15],
    energy: 7,
    editable: [12, 2, 11],
    markers: { 13: 'current', 5: 'octopus', 9: 'cell' },
    extra: { hasSluice: true }
  };
  const moonFinal = {
    ...moon,
    title: '月球 · 一楼开门了',
    instruction: '信号塔仍需通电。最后一次决定是直冲一楼，还是接上维修站里的机器人一起回去。',
    editable: [0, 10, 7]
  };
  const seaFinal = {
    ...sea,
    title: '深海 · 一楼开门了',
    instruction: '一楼就在水面。你可以先开闸走短线，也可以在灯塔下停一下，把章鱼带回办公室。',
    editable: [14, 6, 11]
  };
  const nextTour = {
    title: '冰箱 · 半夜出发',
    instruction: '新一季从冰箱二层开始。转好弯轨，从上方滑出去，或走下方带上冻得发抖的机器人。',
    short: [7, 3, 2, 1, 0, 4],
    long: [7, 11, 10, 14, 13, 12, 8, 4],
    energy: 6,
    editable: [0, 12],
    markers: { 14: 'robot', 13: 'cell' }
  };

  function levelFor(tour, episode, route) {
    if (episode === 1) {
      return makeBoard(tour === 1 ? 'elevator' : 'freezer', tour === 1 ? tutorial : nextTour);
    }
    const underwater = route === 'sea';
    const base = underwater ? sea : moon;
    if (episode === 2) return makeBoard(route, base);
    if (episode === 4) return makeBoard(route + '-final', underwater ? seaFinal : moonFinal);
    return makeBoard(route + '-module', {
      ...base,
      title: '出发前 · 只能装一个零件',
      instruction: '短线要用折叠弯轨接上缺口。长线能带同伴，但需要备用电池，选好零件再搭轨。',
      energy: 6,
      markers: {
        [base.short[2]]: 'fold',
        5: underwater ? 'octopus' : 'robot'
      },
      extra: { modules: true }
    });
  }

  function draftFor() {
    return { gate: 0, turns: {}, sluice: false, module: 'fold' };
  }

  function ports(level, draft, index) {
    const tile = level.cells[index];
    if (!tile) return [];
    if (index === level.start) return [tile.connections[draft.gate]];
    const turn = tile.turn ? (draft.turns[index] ?? 3) : 0;
    return tile.connections.map(port => (port + turn) % 4);
  }

  function nextCell(index, heading) {
    if (heading === undefined) return -1;
    const col = index % 4;
    if ((heading === west && col === 0) || (heading === east && col === 3)) return -1;
    const next = index + deltas[heading];
    return next < 0 || next > 15 ? -1 : next;
  }

  function run(level, draft) {
    const maximum = level.energy + (level.modules && draft.module === 'battery' ? 2 : 0);
    let energy = maximum;
    let index = level.start;
    let back = -1;
    let signal = false;
    let companion = null;
    const path = [{ index, energy }];
    const visited = new Set();
    const spentCells = new Set();
    const outcome = (success, reason) => ({ success, reason, path, signal, companion, energy });

    while (true) {
      const marker = level.cells[index].tag;
      if (marker === 'relay') signal = true;
      if (marker === 'robot' || marker === 'octopus') companion = marker;
      if (marker === 'cell' && !spentCells.has(index)) {
        spentCells.add(index);
        energy = Math.min(maximum, energy + 2);
        path.at(-1).energy = energy;
        path.at(-1).charged = true;
      }
      if (index === level.finish) {
        return level.needsSignal && !signal ? outcome(false, 'signal') : outcome(true, 'finish');
      }
      if (energy === 0) return outcome(false, 'empty');
      const key = index + ':' + back;
      if (visited.has(key)) return outcome(false, 'loop');
      visited.add(key);

      const heading = ports(level, draft, index).find(port => port !== back);
      const next = nextCell(index, heading);
      if (next < 0 || !level.cells[next]) return outcome(false, 'rail');
      const entry = (heading + 2) % 4;
      if (!ports(level, draft, next).includes(entry)) return outcome(false, 'rail');
      const target = level.cells[next].tag;
      if (target === 'current' && !draft.sluice) return outcome(false, 'current');
      if (target === 'fold' && draft.module !== 'fold') return outcome(false, 'fold');
      index = next;
      back = entry;
      energy--;
      path.push({ index, energy });
    }
  }

  return { levelFor, draftFor, ports, run, names };
})();
</script>
<script>
'use strict';

const key = 'mengniu-milk-rail-demo-v1';
const episodeNames = ['接轨出逃', '信号丢了', '只能装一个零件', '一楼开门了'];
const tourNames = { 1: '电梯不到一楼', 2: '冰箱半夜开门' };
const routeNames = { moon: '月球', sea: '深海' };
const characters = { robot: '机器人', octopus: '章鱼' };
const tagNames = {
  start: '起点', finish: '出口', cell: '电池', robot: '机器人', octopus: '章鱼',
  relay: '信号塔', current: '暗流', fold: '弯轨桥'
};
const errorCopy = {
  rail: '前方断轨，转一下停靠点旁的黄色轨道再试。',
  empty: '电量用完。试试更短的路线，或先经过电池。',
  loop: '轨道绕回来了。调一下方向，让电梯能去出口。',
  current: '前面是暗流。先开排水闸，或者绕过去。',
  fold: '近路少一截轨道。装折叠弯轨，或者改走长线。',
  signal: '出口还没通电。先让电梯经过信号塔。'
};
function releaseDate(tour, episode) {
  const date = new Date(Date.UTC(2026, 10, 27 + ((tour - 1) * 4 + episode - 1) * 7));
  return (date.getUTCMonth() + 1) + ' 月 ' + date.getUTCDate() + ' 日 周五 12:00（北京时间）';
}
const weekLabels = ['首发周', '第 2 周', '第 3 周', '第 4 周', '新一季首发', '新一季第 2 周'];
const defaultState = () => ({
  time: 0, logged: false, tours: {}, drafts: {}, rewards: [],
  reminderMode: 'available', fulfillMode: 'ok', reminders: {}, messages: {}
});
let state = defaultState();
let storageAllowed = true;
try {
  const saved = JSON.parse(localStorage.getItem(key) || 'null');
  if (saved) state = { ...state, ...saved };
} catch {
  storageAllowed = false;
}

const app = document.querySelector('#app');
const lab = document.querySelector('#lab');
const confirmDialog = document.querySelector('#confirm-dialog');
let attempt = null;
let motion = null;
let hintUsed = {};
let pendingGift = 'bonus';
let chosenDestination = null;
let windowResize = 0;

function save() {
  if (!storageAllowed) return;
  try {
    localStorage.setItem(key, JSON.stringify(state));
  } catch {
    storageAllowed = false;
  }
}
function publishedTour() {
  return state.time >= 4 ? 2 : 1;
}
function publishedEpisode(tour) {
  return Math.min(tour === 2 ? 2 : 4, Math.max(0, state.time - (tour - 1) * 4 + 1));
}
function ensureTour(tour) {
  state.tours[tour] ??= { destination: null, finished: {} };
  return state.tours[tour];
}
function nextEpisode(tour) {
  let next = 1;
  while (state.tours[tour]?.finished[next]) next++;
  return next;
}
function episodeKey(tour, episode) {
  return tour + '-' + episode;
}
function ids(label) {
  const pair = /^([12])-([1-4])$/.exec(label || '');
  return pair ? [Number(pair[1]), Number(pair[2])] : [0, 0];
}
function readRoute() {
  const [name = '', id = ''] = location.hash.slice(1).split('/');
  return { name: name || 'mini', id };
}
function go(name, id = '', replace = false) {
  if (lab.open) lab.close();
  if (confirmDialog.open) confirmDialog.close();
  const hash = '#' + name + (id ? '/' + id : '');
  if (location.hash === hash) {
    render();
    return;
  }
  if (replace) location.replace(hash);
  else location.hash = hash;
}
function link(copy, name, id = '', kind = 'primary') {
  return '<button type="button" class="' + kind + '" data-go="' + name + '" data-id="' + id + '">' + copy + '</button>';
}
function act(copy, action, id = '', kind = 'primary', disabled = false) {
  return '<button type="button" class="' + kind + '" data-act="' + action + '" data-id="' + id + '"' + (disabled ? ' disabled' : '') + '>' + copy + '</button>';
}
function actions(...buttons) {
  return '<div class="actions">' + buttons.filter(Boolean).join('') + '</div>';
}
function back(name = 'activity', id = '') {
  return link('‹ 返回', name, id, 'back');
}
function choice(action, selected, options) {
  return '<div class="choose">' + options.map(([id, term, detail]) =>
    '<button type="button" data-act="' + action + '" data-id="' + id + '" aria-pressed="' + (id === selected) +
    '"><strong>' + term + '</strong><small>' + detail + '</small></button>').join('') + '</div>';
}
function page(kicker, title, copy, content, parent = 'activity', parentId = '') {
  return '<article class="page">' + back(parent, parentId) + '<p class="kicker">' + kicker + '</p>' +
    '<h1 class="title" tabindex="-1" data-route-heading>' + title + '</h1>' +
    (copy ? '<p class="lead">' + copy + '</p>' : '') + content + '</article>';
}
function list(entries) {
  return '<ul class="rows">' + entries.map(([title, copy, button]) =>
    '<li><div><strong>' + title + '</strong><small>' + copy + '</small></div>' + (button || '') + '</li>').join('') + '</ul>';
}
function callout(copy) {
  return '<div class="callout">' + copy + '</div>';
}
function hero(kicker, title, copy, buttons) {
  return '<section class="hero"><div class="hero-copy"><p class="kicker">' + kicker + '</p>' +
    '<h1 class="title" tabindex="-1" data-route-heading>' + title + '</h1><p class="lead">' + copy + '</p>' + buttons +
    '</div><div class="hero-art" role="img" aria-label="乘奶盒电梯出逃的小牛"></div></section>';
}
function mini() {
  return hero('蒙牛会员中心', '奶盒<br>出逃计划', '把电梯开到月球，或者沉进深海。第一关现在就能玩。',
    actions(link('进入活动', 'activity', '', 'accent'))) +
    '<nav class="mini-nav" aria-label="会员中心"><strong>小程序首页</strong>' +
    link('服务消息', 'inbox', '', 'bare') + link('我的权益', 'wallet', '', 'bare') + '</nav>';
}
function activity(requested) {
  const tour = [1, 2].includes(requested) && requested <= publishedTour() ? requested : publishedTour();
  const progress = state.tours[tour];
  const episode = nextEpisode(tour);
  let focal = link('打开奶盒，开始接轨', 'game', episodeKey(tour, 1), 'accent');
  if (episode > 1 && episode <= publishedEpisode(tour)) {
    focal = link('继续第 ' + episode + ' 集', 'game', episodeKey(tour, episode), 'accent');
  } else if (episode > 4) {
    focal = link('回看我的结局', 'ending', String(tour), 'accent');
  } else if (episode > 1) {
    focal = link('查看下一集预告', 'ticket', String(tour), 'accent');
  }

  const plan = episodeNames.map((name, idx) => {
    const num = idx + 1;
    const done = progress?.finished[num];
    const status = done ? '已通关 · 可回看' : num > publishedEpisode(tour) ? '暂未更新' :
      num > episode ? '先完成上一集' : '可以开始';
    const button = done ? link('回看', num === 4 ? 'ending' : 'game', num === 4 ? String(tour) : episodeKey(tour, num), 'secondary')
      : num === episode && num <= publishedEpisode(tour) ? link('开始', 'game', episodeKey(tour, num), 'secondary') : '';
    return ['第 ' + num + ' 集 · ' + (tour === 2 && num === 1 ? '冰箱二层' : name), status, button];
  });
  return hero('第 ' + tour + ' 季 · ' + tourNames[tour], tour === 1 ? '电梯<br>不到一楼' : '冰箱<br>半夜开门',
    '给奶盒小牛接上轨道。直达出口，还是绕路把同伴带出去？',
    actions(focal, link('返回小程序首页', 'mini', '', 'secondary'))) +
    '<section class="week-plan"><div><h2>本季剧情</h2>' + list(plan) +
    '</div><div><h2>两周线上礼</h2><p class="dim">两个不同活动周各首次通关一次，确定兑一份。没有抽奖也可以拿到。</p>' +
    rewardProgress() + actions(link('查看奖励', 'wallet', '', 'secondary')) +
    (tour > 1 ? link('回看上一季', 'activity', '1', 'bare') : '') + '</div></section>';
}
function story() {
  const stories = [1, 2].filter(tour => tour <= publishedTour()).map(tour => {
    const info = state.tours[tour];

      (number <= count ? '✓ 已完成' : '待完成') + '第 ' + number + ' 周</span>').join('') + '</div>';
}
const giftNames = { bonus: '番外短片＋动态表情', coupon: '5 元商城券' };
const giftDetails = { bonus: '看小牛把电梯开回冰箱的番外', coupon: '模拟指定商品可用，示例无门槛' };
const demoProducts = {
  milk: { title: '蒙牛纯牛奶 250mL', price: 8 },
  yogurt: { title: '蒙牛原味酸奶 200g', price: 9 }
};
function giftBy(id) {
  return /^\d+$/.test(id) ? state.rewards[Number(id)] : undefined;
}
function rewardState(gift) {
  if (gift.order) return '已使用';
  if (gift.status === 'ok') return '已到账';
  if (gift.status === 'pending') return '发放处理中';
  if (expired(gift)) return '已过期';
  if (gift.status === 'failed') return '暂未发放';
  return gift.unlock === null ? '待达标' : '可兑换';
}
function wallet() {
  const entries = state.rewards.map((gift, index) => [
    gift.type ? giftNames[gift.type] : '两周线上礼',
    '第 ' + (index + 1) + ' 轮 · ' + rewardState(gift),
    link('查看', 'reward', String(index), 'secondary')
  ]).reverse();
  return page('权益与回看', '我的权益', state.logged ?
    '同一账号跨两个活动周首次通关，确定获得一份可选权益。' : '登录的测试账号可以体验跨周权益。先试玩，随时回来保存进度。',
    rewardProgress() + (entries.length ? list(entries) : actions(state.logged ? link('返回活动', 'activity') :
      link('登录保存进度', 'login', String(publishedTour()), 'secondary'))));
}
function reward(id) {
  const gift = giftBy(id);
  if (!gift) return wallet();
  if (gift.status === 'ok') {
    return page('兑换成功', giftNames[gift.type] + '已到账', gift.type === 'coupon' ? '可在模拟商城体验抵扣。' : '番外已解锁，可以随时回看。',
      actions(gift.type === 'coupon' ? (gift.order ? link('查看模拟订单', 'order', id) : act('前往模拟商城', 'commerce', id)) :
        link('播放番外', 'bonus', id), link('返回活动', 'activity', '', 'secondary')), 'wallet');
  }
  if (expired(gift)) return page('两周线上礼', '本次兑换窗口已结束', '可在下一轮继续挑战。已到账权益仍可在权益页查看。',
    actions(link('查看我的权益', 'wallet')), 'wallet');
  if (gift.status === 'pending') return page('线上权益', '发放处理中', '正在等待原申请的结果。可以查询同一笔记录。',
    actions(act('查询原单', 'query-reward', id), link('返回我的权益', 'wallet', '', 'secondary')), 'wallet');
  if (gift.status === 'failed') return page('线上权益', '本次发放暂未成功', '已保留你选择的权益。可重试原申请。',
    actions(act('重试原申请', 'submit-reward', id), link('返回我的权益', 'wallet', '', 'secondary')), 'wallet');
  if (gift.unlock === null) return page('两周线上礼', '再完成一个活动周', '每个活动周最多计一次。不同时间回来，完成一集还没通关过的主剧情。',
    rewardProgress() + actions(link('回活动继续', 'activity')), 'wallet');
  return page('两周达标', '选一份线上权益', '确认后按你的选择发放一份。',
    choice('gift', pendingGift, Object.entries(giftNames).map(([code, name]) => [code, name, giftDetails[code]])) +
    actions(act('确认兑换', 'submit-reward', id)), 'wallet');
}
function submitReward(id, query = false) {
  const gift = giftBy(id);
  if (!gift || gift.unlock === null || expired(gift) || gift.status === 'ok') return;
  if (query !== (gift.status === 'pending')) return;
  gift.type ??= pendingGift;
  gift.status = state.fulfillMode;
  save();
  render();
}
function bonus(id) {
  if (giftBy(id)?.type !== 'bonus' || giftBy(id)?.status !== 'ok') return wallet();
  return page('数字权益 · 番外', '冰箱里还有一站', '小牛以为回到了家，拉开冰箱才发现：冷冻室的按钮写着「继续上行」。',
    '<div class="result-paper"><div class="bonus-scene" role="img" aria-label="冰箱电梯和冰块机器人">' +
    '<div class="bonus-bot" aria-hidden="true"><i></i><i></i></div><div class="bonus-door left"></div><div class="bonus-door right"></div></div>' +
    '<div class="bonus-caption" aria-live="polite"><h2>今晚的下一站</h2><p>电梯门里传来一声「叮」。</p></div></div>' +
    actions(act('播放番外动画', 'bonus-play'), act('播放动态表情', 'sticker', '', 'secondary'), link('返回我的权益', 'wallet', '', 'bare')), 'reward', id);
}
function commerce(id) {
  const gift = giftBy(id);
  if (gift?.type !== 'coupon' || gift.status !== 'ok' || gift.order) return;
  openConfirm('进入模拟商城', '查看适用商品并体验 5 元券抵扣。', link('允许进入', 'shop', id),
    act('取消', 'dismiss-confirm', '', 'secondary'));
}
function shop(id) {
  const gift = giftBy(id);
  if (gift?.type !== 'coupon' || gift.status !== 'ok') return wallet();
  if (gift.order) return order(id);
  return page('模拟商城', '选择适用商品', '使用示例 5 元券，无需真实支付。',
    list(Object.entries(demoProducts).map(([product, detail]) => [detail.title, '模拟价格 ¥' + detail.price,
      link('选购', 'checkout', id + '-' + product, 'secondary')])), 'reward', id);
}
function checkout(ref) {
  const [id, product] = ref.split('-');
  const gift = giftBy(id);
  const detail = Object.hasOwn(demoProducts, product) ? demoProducts[product] : null;
  if (!detail || gift?.type !== 'coupon' || gift.status !== 'ok') return wallet();
  if (gift.order) return order(id);
  return page('模拟抵扣', '确认使用 5 元券', detail.title + ' · 商品 ¥' + detail.price + ' · 抵扣 ¥5',
    callout('<strong>模拟应付 ¥' + (detail.price - 5) + '</strong>') +
    actions(act('确认模拟抵扣', 'pay', ref)), 'shop', id);
}
function pay(ref) {
  const [id, product] = ref.split('-');
  const gift = giftBy(id);
  if (!Object.hasOwn(demoProducts, product) || gift?.type !== 'coupon' || gift.status !== 'ok' || gift.order) return;
  gift.order = product;
  save();
  go('order', id, true);
}
function order(id) {
  const gift = giftBy(id);
  if (!gift?.order) return wallet();
  const detail = demoProducts[gift.order];
  return page('模拟订单', '礼券已使用', detail.title + ' · 已抵扣 ¥5 · 模拟实付 ¥' + (detail.price - 5),
    actions(link('返回我的权益', 'wallet'), link('继续活动', 'activity', '', 'secondary')), 'wallet');
}
function openConfirm(title, copy, ...buttons) {
  confirmDialog.innerHTML = '<div class="modal-head"><h2 id="confirm-title">' + title +
    '</h2></div><p class="dim">' + copy + '</p>' + actions(...buttons);
  confirmDialog.showModal();
}
function openLab() {
  document.querySelector('#clock').innerHTML = weekLabels.map((label, index) => act(label, 'advance', String(index), 'secondary', index <= state.time)).join('');
  document.querySelector('#reminder-mode').value = state.reminderMode;
  document.querySelector('#fulfill-mode').value = state.fulfillMode;
  lab.showModal();
}
function stopMotion() {
  if (motion) {
    motion.kill();
    motion = null;
  }
}
function advance(week) {
  if (week <= state.time || week >= weekLabels.length) return;
  stopMotion();
  state.time = week;
  attempt = null;
  deliver();
  save();
  go('mini');
}
function resetAll() {
  stopMotion();
  state = defaultState();
  attempt = null;
  hintUsed = {};
  pendingGift = 'bonus';
  save();
  go('mini', '', true);
}
const routes = {
  mini, activity: id => activity(Number(id)), story, wallet, rules, game,
  destination: id => destination(Number(id)),
  ticket: id => ticket(Number(id)),
  login: id => login(Number(id)),
  subscribe, 'reminder-unavailable': reminderUnavailable, inbox, message, cleared,
  ending: id => ending(Number(id)), reward, bonus, shop, checkout, order
};
function render(focus = false) {
  const { name, id } = readRoute();
  app.innerHTML = Object.hasOwn(routes, name) ? routes[name](id) : mini();
  if (name === 'game') placeCar(id);
  const banners = Object.keys(state.messages).filter(item => liveMessage(item) && !state.messages[item].read);
  document.querySelector('#notice').innerHTML = banners.map(item => {
    const [tour, episode] = ids(item);
    return '<aside class="notice"><div class="wrap"><strong>模拟消息 · ' +
      routeNames[state.tours[tour].destination] + '第 ' + episode + ' 集可继续</strong>' +
      link('查看消息', 'message', item, 'bare') + '</div></aside>';
  }).join('') + (storageAllowed ? '' : '<p class="notice">浏览器限制存储，本次进度只保留在当前页面。</p>');
  if (focus) {
    window.scrollTo(0, 0);
    [...app.querySelectorAll('[data-route-heading]')].find(element => element.getClientRects().length)?.focus({ preventScroll: true });
  }
}
function editBoard(id, index) {
  const data = gameData(id);
  if (!data?.level.cells[index]?.turn) return;
  const draft = getDraft(id);
  if (index === data.level.start) draft.gate = 1 - draft.gate;
  else draft.turns[index] = ((draft.turns[index] ?? 3) + 1) % 4;
  attempt = null;
  save();
  render();
  document.querySelector('[data-tile="' + index + '"]')?.focus({ preventScroll: true });
}
function launch(id) {
  const data = gameData(id);
  if (!data || motion) return;
  const draft = getDraft(id);
  const result = Rail.run(data.level, draft);
  attempt = null;
  render();
  animateRun(data.level, draft, result, id);
}
function handleGame(action, value, id) {
  const data = gameData(id);
  if (!data || motion) return;
  const draft = getDraft(id);
  if (action === 'launch') return launch(id);
  if (action === 'turn') return editBoard(id, Number(value));
  if (action === 'finish') {
    if (data.episode === 1) openDestination(data.tour);
    else recordEpisode(id);
    return;
  }
  if (action === 'hint') {
    const estimate = Rail.run(data.level, draft);
    hintUsed[id] = true;
    render();
    announce(estimate.success ? '机器人：照现在这条路能顺利到达。' :
      '机器人：留意第 ' + (Math.floor(estimate.path.at(-1).index / 4) + 1) + ' 行附近。' + errorCopy[estimate.reason]);
    return;
  }
  if (action === 'board-reset') {
    state.drafts[id] = Rail.draftFor();
  } else if (action === 'sluice' && data.level.hasSluice) {
    draft.sluice = !draft.sluice;
  } else if (action === 'module' && data.level.modules && ['fold', 'battery'].includes(value)) {
    draft.module = value;
  }
  attempt = null;
  save();
  render();
}
const gameActions = new Set(['turn', 'launch', 'finish', 'board-reset', 'try-again', 'hint', 'sluice', 'module']);
const commands = {
  lab: openLab,
  'close-lab': () => lab.close(),
  'dismiss-confirm': () => confirmDialog.close(),
  reset: resetAll,
  advance: value => advance(Number(value)),
  destination: value => {
    if (!Object.hasOwn(routeNames, value)) return;
    chosenDestination = value;
    render();
    document.querySelector('.choose [aria-pressed="true"]')?.focus();
  },
  'save-destination': tour => recordEpisode(episodeKey(Number(tour), 1), chosenDestination),
  authorize: value => confirmLogin(Number(value)),
  'sign-in': value => signIn(Number(value)),
  remind: id => reminderDecision(id, 'allowed'),
  'reject-reminder': id => reminderDecision(id, 'rejected'),
  'cancel-reminder': id => reminderDecision(id, 'cancelled'),
  'open-message': openMessage,
  download: value => downloadEnding(Number(value)),
  gift: value => {
    if (!Object.hasOwn(giftNames, value)) return;
    pendingGift = value;
    render();
    document.querySelector('.choose [aria-pressed="true"]')?.focus();
  },
  'submit-reward': id => submitReward(id),
  'query-reward': id => submitReward(id, true),
  'bonus-play': () => {
    const scene = document.querySelector('.bonus-scene');
    const panel = document.querySelector('.bonus-caption');
    panel.innerHTML = '<h2>冰块机器人上车了</h2><p>小牛把奶盒推到驾驶座。这次电梯自己按了冷冻层，门缝里飘出一朵小雪花。</p>';
    scene.classList.add('opened');
    const doors = scene.querySelectorAll('.bonus-door');
    if (!window.gsap || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    gsap.killTweensOf(doors);
    const storyMotion = gsap.timeline();
    storyMotion.fromTo(doors[0], { xPercent: 0 }, { xPercent: -102, duration: .55 }, 0);
    storyMotion.fromTo(doors[1], { xPercent: 0 }, { xPercent: 102, duration: .55 }, 0);
    storyMotion.fromTo(scene.querySelector('.bonus-bot'), { y: 10, scale: .75 }, { y: 0, scale: 1, duration: .45, ease: 'back.out(1.5)' }, .25);
  },
  sticker: () => {
    const scene = document.querySelector('.bonus-scene');
    scene.classList.add('opened');
    document.querySelector('.bonus-caption').innerHTML = '<h2>冰块机器人：叮！</h2><p>这是随番外解锁的动态表情。</p>';
    if (window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      gsap.fromTo(scene.querySelector('.bonus-bot'), { rotation: -12, scale: .86 },
        { rotation: 0, scale: 1, duration: .62, ease: 'elastic.out(1,.45)' });
    }
  },
  commerce, pay
};
document.addEventListener('click', event => {
  const button = event.target.closest('button[data-go],button[data-act]');
  if (!button) return;
  const { go: name, act: action, id } = button.dataset;
  if (name) {
    stopMotion();
    go(name, id);
    return;
  }
  if (gameActions.has(action)) {
    const route = readRoute();
    if (route.name === 'game') handleGame(action, id, route.id);
  } else if (Object.hasOwn(commands, action)) {
    commands[action](id);
  }
});
document.querySelector('#reminder-mode').addEventListener('change', event => {
  state.reminderMode = event.target.value;
  save();
});
document.querySelector('#fulfill-mode').addEventListener('change', event => {
  state.fulfillMode = event.target.value;
  save();
});
window.addEventListener('hashchange', () => {
  stopMotion();
  render(true);
});
window.addEventListener('resize', () => {
  cancelAnimationFrame(windowResize);
  windowResize = requestAnimationFrame(() => {
    if (!motion && readRoute().name === 'game') placeCar(readRoute().id);
  });
});
deliver();
save();
render();
</script>
</body>
</html>
